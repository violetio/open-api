      - Payments - Distributions
      summary: Get Distributions by Payout Id
      description: "Returns a page of the distributions on one payout: its sales,\
        \ refunds, adjustments and dispute adjustments, each row's type saying which.\
        \ The payout's summary totals the sales and refunds only, so adjustments and\
        \ dispute adjustments appear here but not in the summary. A merchant reads\
        \ its own payouts, whichever app they came through. A channel reads either\
        \ its own payouts, with account_type developer, or the payouts of a merchant\
        \ that its app is, or has been, connected to, with account_type merchant.\
