                    empty: true
        "400":
          description: "The request could not be used and nothing was searched. empty_body:\
            \ no body was sent; send {} to search without filters. invalid_parameter:\
            \ account_type is neither merchant nor developer. missing_parameter: a\
            \ channel searching a merchant's payouts through Violet's own dashboard\
            \ did not say which app (app_id). A body that is not valid JSON, or a\
            \ field that does not parse (an unknown status, a date not written like\
            \ 2026-09-01T00:00:00+0000), is also refused with 400, as a plain-text\
            \ description of the problem rather than this JSON body."
          content:
            application/json:
              examples:
                empty_body:
                  description: empty_body
                  value:
                    message: Empty body in request. Expected PayoutSearchRequest object.
                    error: empty_body
                    code: 9910
                invalid_parameter:
                  description: invalid_parameter
                  value:
                    message: Parameter 'account_type' is invalid.
                    error: invalid_parameter
                    code: 9001
                missing_parameter:
                  description: missing_parameter
                  value:
                    message: Required parameter 'app_id' cannot be null or empty.
                    error: missing_parameter
                    code: 9002
            text/plain:
              schema:
                type: string
                description: "A body that is not valid JSON, or a field that does\
                  \ not parse. The text is the JSON parser's own description of the\
                  \ problem; its wording is not part of this contract."
        "401":
          description: "The request was refused and nothing was read. invalid_api_credentials:\
            \ the token is malformed or wrongly signed, which includes a token issued\
            \ for another app id or app secret than the ones sent with it. A token\
            \ that is expired, or missing, is refused with 401 as well. merchant_not_connected:\
            \ the channel's app is not connected to the merchant in the path, so none\
            \ of the merchant's payouts were read. Only a channel reading a merchant's\
            \ payouts can get this answer: a merchant, or a channel reading its own\
            \ payouts, is not refused this way. The same answer is given when the\
            \ connection could not be confirmed."
          content:
            application/json:
              examples:
                invalid_api_credentials:
                  description: invalid_api_credentials
                  value:
                    message: One or more of your API Credentials are invalid.
                    error: invalid_api_credentials
                    code: 9903
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant. Merchant must connect
                      to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The credentials do not permit this read: for example a merchant\
            \ reading another merchant's payouts, a channel reading another channel's,\
            \ or a channel naming an app (app_id, through Violet's own dashboard)\
            \ that it does not own. No payouts were read."
          content:
            application/json:
              examples:
                Access Denied:
                  description: Access Denied
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
