                      payment_service: STRIPE
                    - id: 12347
                      type: REFUND
                      payout_account_id: 5678
                      payout_account_type: MERCHANT
                      currency: USD
                      amount: -350
                      net_distribution_amount: -350
                      tax_amount: 0
