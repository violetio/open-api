  /payments/{account_type}/{account_id}/distributions/search:
    post:
      tags:
      - Payments - Distributions
      summary: Search Distributions
      description: "Returns the distributions on an account that match every filter\
        \ in the body, newest first. Use it to reconcile a specific order, bag, payout\
        \ or transfer: the commission charged on an order and the commission reversed\
        \ by its refunds are the order's PAYMENT and REFUND distributions. Get Distributions\
        \ pages through everything on the account; this narrows it by the body instead.\
        \ Filters combine with AND, an omitted field does not filter, and {} matches\
        \ everything the account can see. A merchant search covers the merchant's\
        \ own orders and a channel search covers the channel's app. Reading refunds:\
        \ on a REFUND distribution, commission is a figure for the bag, repeated on\
        \ every refund of it. It is not the commission that refund reversed, so never\
        \ sum it across refunds. The commission that refund reversed is commission_reversed_amount,\
        \ with the same sign as commission on the row. Sum that instead. It can be\
        \ empty on refunds recorded before 2026-10-02. net_distribution_amount is\
        \ what the refund moved for that account, signed from its side: negative when\
        \ money is taken back, positive when it is paid, which a refund recorded with\
        \ a payment-provider fee credit can be. A Stripe refund records no fee credit:\
        \ the processing fee of the sale stays with whoever bore it, so payment_provider_total_fee\
        \ on its refund rows is 0 or absent. Older Stripe refund rows, and Nuvei refund\
        \ rows, can carry a negative payment_provider_total_fee, which is a fee credit\
        \ that Violet worked out and recorded, not a fee the provider returned. On\
        \ the channel's row that movement is not the commission reversed on its own:\
        \ it can also carry tax or duty the channel remits, and a correction for a\
        \ refund discrepancy. On a bag whose payment distributions have totals_include_commission\
        \ false, a refund reverses no commission at all and commission_reversed_amount\
        \ is 0. A refund row carries amount, equal to net_distribution_amount, and\
        \ no distribution_amount. A search that matches nothing returns an empty page,\
        \ not a 404."
      operationId: searchDistributions
      parameters:
      - name: X-Violet-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        required: true
        schema:
          type: integer
          format: int32
      - name: account_type
        in: path
        description: "Whose distributions to search: merchant, or developer for a\
          \ channel. Case-insensitive; any other value is refused with 400 invalid_parameter."
        required: true
        schema:
          type: string
          enum:
          - merchant
          - developer
      - name: account_id
        in: path
        description: "The merchant id when account_type is merchant, or the channel's\
          \ developer id when it is developer. Must be an account the credentials\
          \ belong to."
        required: true
        schema:
          type: integer
          format: int32
      - name: include_merchants
        in: query
        description: "Channel searches only. true returns the merchants' distributions\
          \ on the channel's orders as well as the channel's own; false returns only\
          \ the channel's own, those with payout_account_type DEVELOPER. Ignored on\
          \ a merchant search."
        schema:
          type: boolean
          default: true
      - name: include_channels
        in: query
        description: "Merchant searches only. true returns the channels' distributions\
          \ on the merchant's orders as well as the merchant's own; false returns\
          \ only the merchant's own, those with payout_account_type MERCHANT. Ignored\
          \ on a channel search."
        schema:
          type: boolean
          default: true
      - name: size
        in: query
        description: "Results per page, at most 100. Out-of-range values are adjusted\
          \ rather than refused: above 100 becomes 100, and below 1 becomes 10. The\
          \ size applied is returned in the response's size. (Violet's own dashboard\
          \ has a ceiling of 500.)"
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        description: "Page to return, counting from 1. Values below 1 become 1. The\
          \ response's number counts from 0, so page 1 comes back as number 0."
        schema:
          type: integer
          format: int32
          default: 1
      requestBody:
        description: "The filters, all optional. merchant_id narrows a channel search;\
          \ a merchant search is always limited to the merchant in the path. before_date\
          \ and after_date are inclusive, compare against date_created, and must be\
          \ written with a numeric offset, as 2026-09-01T00:00:00+0000: the forms\
          \ 2026-09-01T00:00:00Z and 2026-09-01T00:00:00+00:00 are refused."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionSearchRequest'
            examples:
              Every distribution for one order:
                description: Every distribution for one order
                value:
                  order_id: 54609
              Refund distributions for one order:
                description: Refund distributions for one order
                value:
                  order_id: 54609
                  distribution_type: REFUND
              Distributions created in September 2026:
                description: Distributions created in September 2026
                value:
                  after_date: 2026-09-01T00:00:00+0000
                  before_date: 2026-09-30T23:59:59+0000
        required: true
      responses:
        "200":
          description: "The matching distributions, newest first. May be an empty\
            \ page."
          content:
            application/json:
              examples:
                Refund distributions for one order (channel):
                  description: Refund distributions for one order (channel)
                  value:
                    content:
