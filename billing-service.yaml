components:
  schemas:
    RecoveryAllocationResponse:
      type: object
      properties:
        id:
          type: integer
          description: "Null for seq 0, the refund's own reversal."
          format: int64
        recovery_case_id:
          type: integer
          description: The recovery case this allocation belongs to.
          format: int64
        seq:
          type: integer
          description: "Order within the case. Draws start at 1. A draw on a transfer\
            \ that paid several sales is listed once per sale, with the same seq."
          format: int32
        funding_type:
          type: string
          description: OWN_TRANSACTION (the sale's own transfer) or BORROWED_REVERSAL
            (another of the retailer's transfers).
        window:
          type: string
          description: "OWN, IN_WINDOW (a sale in the 120 days before the case opened)\
            \ or BEYOND_WINDOW."
        status:
          type: string
          description: EXECUTED or FAILED. A draw in progress is not listed.
        amount:
          type: integer
          description: "Amount recovered by this allocation, and its currency."
          format: int64
        currency:
          type: string
          description: "Amount recovered by this allocation, and its currency."
        stripe_transfer_reversal_id:
          type: string
          description: The Stripe reversal and the Stripe transfer drawn on.
        stripe_transfer_id:
          type: string
          description: The Stripe reversal and the Stripe transfer drawn on.
        funding_payout_transfer_id:
          type: integer
          description: The Violet transfer drawn on.
          format: int64
        donor_order_id:
          type: integer
          description: "The order and bag the amount came from; for seq 0, the refunded\
            \ order and bag."
          format: int64
        donor_bag_id:
          type: integer
          description: "The order and bag the amount came from; for seq 0, the refunded\
            \ order and bag."
          format: int64
        failure_reason:
          type: string
          description: Set only when status is FAILED.
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
      description: Single-case response only.
    RecoveryCaseResponse:
      type: object
      properties:
        id:
          type: integer
          description: The recovery case ID; the join key between Violet's records
            and yours.
          format: int64
        recovery_case_id:
          type: integer
          description: "Same as id, matching the webhook payload."
          format: int64
        refund_id:
          type: integer
          description: The refund that opened the case.
          format: int64
        order_id:
          type: integer
          description: The refunded order and bag.
          format: int64
        bag_id:
          type: integer
          description: The refunded order and bag.
          format: int64
        merchant_id:
          type: integer
          description: The retailer that owes the amount.
          format: int32
        payout_account_id:
          type: integer
          description: The retailer's payout account for the refunded sale.
          format: int32
        currency:
          type: string
          description: "The case currency: the currency of the payment connection\
            \ the order was paid through. Where the order names no connection it is\
            \ the currency of the channel's payout account, and for a channel that\
            \ is not on platform payments it is USD. A case that is EXHAUSTED with\
            \ exhausted_reason CURRENCY_UNKNOWN, because no currency could be worked\
            \ out for it, is in the currency of the refunded bag."
        gap_amount:
          type: integer
          description: "The commission the channel kept on this refund, in minor units."
          format: int64
        shortfall_amount:
          type: integer
          description: Any part of the sale's own reversal that came up short because
            an earlier recovery had already drawn on that transfer. Usually 0.
          format: int64
        amount_to_recover:
          type: integer
          description: "What the sale's own reversal returned, plus gap_amount, plus\
            \ shortfall_amount."
          format: int64
        amount_recovered:
          type: integer
          description: The sale's own reversal plus every executed draw; the sum of
            the allocations whose status is EXECUTED.
          format: int64
        remaining_gap:
          type: integer
          description: amount_to_recover minus amount_recovered. Zero or less means
            nothing is owed.
          format: int64
        gap_amount_usd:
          type: integer
          description: "The same amount in US cents, at rates fixed when the case\
            \ opened. Null when a rate was unavailable."
          format: int64
        shortfall_amount_usd:
          type: integer
          description: "The same amount in US cents, at rates fixed when the case\
            \ opened. Null when a rate was unavailable."
          format: int64
        amount_to_recover_usd:
          type: integer
          description: "The same amount in US cents, at rates fixed when the case\
            \ opened. Null when a rate was unavailable."
          format: int64
        shortfall_unknown:
          type: boolean
          description: True when the shortfall could not be measured.
        status:
          type: string
          description: "OPENED, RECOVERING, RECOVERED or EXHAUSTED."
        escalation:
          type: string
          description: "RUNGS_1_2_EXHAUSTED when the case is EXHAUSTED, otherwise\
            \ null."
        exhausted_reason:
          type: string
          description: "NO_DONOR_HEADROOM (can recover later, checked daily), TRANSFER_METHOD_NOT_AUTOMATIC,\
            \ CURRENCY_UNKNOWN or SHORTFALL_UNKNOWN when EXHAUSTED, otherwise null."
        transfer_reversal_ids:
          type: array
          description: "Transfer reversal IDs: the sale's own reversal first, then\
            \ each executed draw."
          items:
            type: integer
            description: "Transfer reversal IDs: the sale's own reversal first, then\
              \ each executed draw."
            format: int64
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
        allocations:
          type: array
          description: Single-case response only.
          items:
            $ref: '#/components/schemas/RecoveryAllocationResponse'
    PageRecoveryCaseResponse:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        first:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryCaseResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        pageable:
          $ref: '#/components/schemas/Pageable'
        numberOfElements:
          type: integer
          format: int32
        last:
          type: boolean
        empty:
          type: boolean
    Pageable:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/Sort'
        unpaged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
    Sort:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
    PaymentPlatformConfiguration:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for this configuration.
          format: int64
        developer_id:
          type: integer
          description: Unique identifier of the developer who owns this configuration.
          format: int32
        payment_platform_connection_id:
          type: integer
          description: Unique identifier of the PaymentPlatformConnection this configuration
            belongs to. 1:1 relationship.
          format: int64
        app_id:
          type: integer
          description: Unique identifier of the Violet application. Optional - connection
            can apply to multiple apps.
          format: int32
        capture_method:
          type: string
          description: "How payments are captured. AUTOMATIC captures immediately,\
            \ CUSTOM allows manual capture."
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        transfer_method:
          type: string
          description: "How transfers to merchants are initiated. AUTOMATIC triggers\
            \ on payment capture, CUSTOM allows manual control."
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        distributions_algorithm:
          type: string
          description: "Name of the algorithm used to calculate distributions. Examples:\
            \ COMMISSION_DEDUCTED_TOTALS_ALGORITHM_V3, CHANNEL_PAYS_PAYMENT_PROVIDER_FEES_ALGORITHM_V2."
        tax_remitter:
          type: string
          description: "Who is responsible for remitting taxes. APP means the channel\
            \ remits, MERCHANT means the merchant remits."
          enum:
          - APP
          - MERCHANT
        transfer_mechanism:
          type: string
          description: "How transfers are executed. STANDARD_TRANSFERS uses Stripe\
            \ /v1/transfers, DESTINATION_PAYMENTS uses Payment Intent with transfer_data.destination."
          enum:
          - STANDARD_TRANSFERS
          - DESTINATION_PAYMENTS
        destination_payment_method_id:
          type: string
          description: Stripe payment method ID (pm_xxx) for destination payments.
            Required when transferMechanism is DESTINATION_PAYMENTS.
        destination_payment_customer_id:
          type: string
          description: "Stripe customer ID (cus_xxx) for destination payments. Optional,\
            \ used with destinationPaymentMethodId."
        date_created:
          type: string
          description: Time at which this configuration was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which this configuration was last modified. In ISO-8601
            format.
          format: date-time
        transfer_schedule:
          $ref: '#/components/schemas/TransferSchedule'
      description: "Configuration for payment processing behavior, including capture\
        \ method, transfer settings, and distribution algorithm. Owned by a PaymentPlatformConnection."
    TransferSchedule:
      type: object
      properties:
        require_fulfillment:
          type: boolean
          description: "Whether bags must be in SHIPPED or DELIVERED status before\
            \ transfers are executed. When true, only distributions for fulfilled\
            \ bags are included in transfer calculations. When false (default), transfers\
            \ execute immediately after payment capture regardless of fulfillment\
            \ status."
          default: false
        time_interval_seconds:
          type: integer
          description: "Minimum time interval in seconds between transfers for a merchant.\
            \ When 0 (default), transfers execute immediately. When > 0, transfers\
            \ are batched and executed at the specified interval. Example: 86400 =\
            \ daily transfers, 604800 = weekly transfers."
          format: int64
          default: 0
        allow_weekend_transfers:
          type: boolean
          description: "When false (default), eligible dates are adjusted to fall\
            \ on business days (Mon-Fri) only. Distributions that would be eligible\
            \ on weekends are deferred to the next Monday. When true, transfers can\
            \ be processed on any day including weekends."
          default: false
    CreatePaymentPlatformConfigurationRequest:
      type: object
      properties:
        payment_platform_connection_id:
          type: integer
          format: int64
        developer_id:
          type: integer
          format: int32
        app_id:
          type: integer
          format: int32
        capture_method:
          type: string
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        transfer_method:
          type: string
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        distributions_algorithm:
          type: string
        tax_remitter:
          type: string
          enum:
          - APP
          - MERCHANT
        transfer_mechanism:
          type: string
          enum:
          - STANDARD_TRANSFERS
          - DESTINATION_PAYMENTS
        require_fulfillment:
          type: boolean
        time_interval_seconds:
          type: integer
          format: int64
        allow_weekend_transfers:
          type: boolean
        destination_payment_method_id:
          type: string
        destination_payment_customer_id:
          type: string
    PaymentPlatformConnection:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the payment platform connection.
          format: int64
        developer_id:
          type: integer
          description: Unique identifier of the developer who owns this connection.
          format: int32
        app_id:
          type: integer
          description: Unique identifier of the Violet application associated with
            this connection. Nullable - connection can apply to multiple apps.
          format: int32
        platform_code:
          type: string
          description: "Developer-defined identifier for this platform connection\
            \ (e.g., 'ACME_UK', 'ACME_US').Must be unique per developer. Used for\
            \ routing orders to the correct payment platform."
        payment_provider:
          type: string
          description: "Payment provider for this connection. Currently supports STRIPE,\
            \ NUVEI, CREDOVA, EXTERNAL."
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        payment_provider_account_id:
          type: string
          description: "Identifier of the platform account in the payment provider\
            \ (e.g., acct_xxx for Stripe). Links to StripePlatformAccount via string\
            \ lookup."
        credential_id:
          type: integer
          description: "Identifier of the credential in CredentialService. Nullable\
            \ for backwards compatibility. Future enhancement: used for direct credential\
            \ lookup without developerId."
          format: int64
        is_active:
          type: boolean
          description: "Whether this connection is active and can be used for payment\
            \ processing. Only one active connection per (developer, platformCode)\
            \ combination."
        date_created:
          type: string
          description: Time at which this connection was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which this connection was last modified. In ISO-8601
            format.
          format: date-time
        date_deactivated:
          type: string
          description: Time at which this connection was deactivated. In ISO-8601
            format.
          format: date-time
        stripe_platform_account:
          $ref: '#/components/schemas/StripePlatformAccount'
      description: "Represents a developer's connection to a payment platform account\
        \ (e.g., Stripe). Used for payment capture, distribution tracking, and transfer\
        \ processing."
    StripePlatformAccount:
      type: object
      properties:
        account_id:
          type: string
          description: Unique identifier for this account in Stripe.
        account_type:
          type: string
          description: "The type of Stripe Connect account, either EXPRESS or STANDARD."
          enum:
          - STANDARD
        banking_country:
          type: string
          description: "Banking country of the Stripe account, taken directly from\
            \ the Stripe account object."
        banking_currency:
          type: string
          description: "Banking currency of the Stripe account, taken directly from\
            \ the Stripe account object."
        charges_enabled:
          type: boolean
          description: Whether the Stripe account can create charges and facilitate
            payments. Taken directly from the Stripe account object.
        payouts_enabled:
          type: boolean
          description: Whether the Stripe account can receive payouts. Taken directly
            from the Stripe account object.
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
      description: Violet entity representing a Stripe account for Violet channels
        using their own platform Stripe account to facilitate payments.
    CreatePaymentPlatformConnectionRequest:
      type: object
      properties:
        developer_id:
          type: integer
          format: int32
        app_id:
          type: integer
          format: int32
        payment_provider_account_id:
          type: string
        platform_code:
          type: string
        credential_id:
          type: integer
          format: int64
    BankingCountryResponse:
      type: object
      properties:
        banking_country:
          type: string
          description: Two-letter country code of the banking country for the developer's
            platform.
    Distribution:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the object.
          format: int32
        type:
          type: string
          description: "What this row records. {PAYMENT} is a sale. {REFUND} is a\
            \ refund of a sale. {ADJUSTMENT} is a correction to what the merchant\
            \ and the channel are owed on a bag. {DISPUTE_ADJUSTMENT} is money taken\
            \ from a party, or given back to it, because of a dispute over the shopper's\
            \ payment."
          enum:
          - PAYMENT
          - REFUND
          - ADJUSTMENT
          - DISPUTE_ADJUSTMENT
        payout_account_id:
          type: integer
          description: "Unique identifier of the payout account this row is paid to,\
            \ or taken from."
          format: int32
        payout_account_type:
          type: string
          description: "Which party's payout account this row belongs to. Can be either\
            \ {DEVELOPER} or {MERCHANT}."
          enum:
          - MERCHANT
          - DEVELOPER
        currency:
          type: string
          description: "Currency of the amounts on this row, for example USD. The\
            \ exception is `payout_amount`, which is in the currency of the payout."
        amount:
          type: integer
          description: "What this row adds to what its party is owed, or takes from\
            \ it, in the smallest unit of the currency, for example cents: positive\
            \ adds, negative takes. See `net_distribution_amount` for how it works\
            \ out on each type of row. It is always the same figure as `net_distribution_amount`."
          format: int32
        net_distribution_amount:
          type: integer
          description: "What this row adds to what its party is owed, or takes from\
            \ it, in the smallest unit of the currency, for example cents, after commission,\
            \ payment provider fees, and the tax and duty that apply to the party.\
            \ Positive adds; negative takes. On a sale it is usually positive: for\
            \ the merchant, its share of the bag; for the channel, its commission\
            \ less the payment provider fees it pays, plus any tax or duty it remits.\
            \ The channel's can be negative when those fees are larger than its commission.\
            \ On a refund it is negative or 0: what the refund takes back from the\
            \ party. On the channel's row of a refund made before 27 October 2026\
            \ it can be positive. On an adjustment it is the adjustment as it was\
            \ submitted, positive or negative. On a dispute adjustment it is negative\
            \ when money is taken because of the dispute, and positive when it is\
            \ given back after the dispute is won."
          format: int32
        distribution_amount:
          type: integer
          description: "On a sale, `net_distribution_amount` plus the payment provider\
            \ fee this row's party pays, in the smallest unit of the currency, for\
            \ example cents: the amount before that fee is taken off. Commission,\
            \ tax and duty are already accounted for in it. On an adjustment or a\
            \ dispute adjustment, the same figure as `net_distribution_amount`. Refund\
            \ rows do not have it."
          format: int32
        tax_amount:
          type: integer
          description: "Tax that is part of this row's amount, in the smallest unit\
            \ of the currency, for example cents. It is on the row of the party that\
            \ remits the tax (see `tax_remitter`) and is 0 on the other party's row.\
            \ Positive or 0, including on a refund row, where `amount` is negative.\
            \ 0 on an adjustment or a dispute adjustment."
          format: int32
        duty_amount:
          type: integer
          description: "Duty that is part of this row's amount, in the smallest unit\
            \ of the currency, for example cents. It is on the row of the party that\
            \ remits the duty (see `duty_remitter`) and is 0 on the other party's\
            \ row. Positive or 0, including on a refund row, where `amount` is negative.\
            \ 0 on an adjustment or a dispute adjustment."
          format: int32
        shipping_amount:
          type: integer
          description: "Shipping that is part of this row's amount, in the smallest\
            \ unit of the currency, for example cents. The merchant bears shipping,\
            \ so it is on the merchant's row and is 0 on the channel's. Positive or\
            \ 0 on a sale or a refund, including on a refund row, where `amount` is\
            \ negative. On an adjustment or a dispute adjustment it holds the same\
            \ signed figure as `amount`, whatever the adjustment was for, so on those\
            \ rows it is not a shipping figure."
          format: int32
        commission:
          type: integer
          description: "The channel's commission on the sale, in the smallest unit\
            \ of the currency, for example cents. On a sale row it is negative on\
            \ the merchant's row, where it is taken from the merchant, and positive\
            \ on the channel's row, where it is earned. It is 0 when no commission\
            \ applies. On a refund row it is the whole sale's commission, not the\
            \ part this refund reversed, and the signs are the other way round: positive\
            \ on the merchant's row and negative on the channel's. See `commission_reversed_amount`\
            \ for the part the refund reversed. Adjustment and dispute adjustment\
            \ rows do not have it. Where the bag's totals are already net of commission\
            \ (`totals_include_commission` is false), it shows the commission the\
            \ channel collected itself and is not taken from the merchant's amount."
          format: int32
        payment_provider_total_fee:
          type: integer
          description: "The payment provider's fee on the sale that this row's party\
            \ pays, in the smallest unit of the currency, for example cents. On a\
            \ sale it is a positive figure that reduces what the party is owed: it\
            \ is on the row of the party that pays the fee and is 0 on the other row,\
            \ and where the fee is split each row shows its part. A refund made on\
            \ or after 27 October 2026 shows 0 on the row that paid the sale's fee,\
            \ and the other row has no fee figure, because Stripe keeps the sale's\
            \ fee when it refunds. Refunds made before then can show a negative figure\
            \ on that row: a fee credit worked out by Violet, not a fee the provider\
            \ returned. A refund through Nuvei can still show a negative figure. Adjustment\
            \ and dispute adjustment rows do not have it."
          format: int32
        payment_provider_volume_fee:
          type: integer
          description: "The percentage-based part of `payment_provider_total_fee`,\
            \ in the smallest unit of the currency, for example cents. It is 0 where\
            \ the channel pays the fee, and on both rows where the fee is split between\
            \ the channel and the merchant, even though the total is set, so the two\
            \ parts do not always add up to the total. Same sign, and on the same\
            \ rows, as `payment_provider_total_fee`."
          format: int32
        payment_provider_fixed_fee:
          type: integer
          description: "The fixed part of `payment_provider_total_fee`, in the smallest\
            \ unit of the currency, for example cents. It is 0 where the channel pays\
            \ the fee, and on both rows where the fee is split between the channel\
            \ and the merchant, even though the total is set, so the two parts do\
            \ not always add up to the total. Same sign, and on the same rows, as\
            \ `payment_provider_total_fee`."
          format: int32
        app_id:
          type: integer
          description: Unique identifier of the Violet application associated with
            this Distribution.
          format: int32
        app_name:
          type: string
          description: Name of the Violet application associated with this Distribution.
        merchant_id:
          type: integer
          description: Unique identifier of the merchant associated with this Distribution.
          format: int32
        merchant_name:
          type: string
          description: Name of the merchant associated with this Distribution.
        merchant_commission_rate:
          type: number
          description: "The commission rate the channel charges the merchant on this\
            \ bag, as a percentage: 10.0 means 10 percent. On a refund row it is the\
            \ rate as the bag stood when the refund was made."
          format: double
        payment_provider_transaction_id:
          type: string
          description: "Unique identifier of the payment provider's transaction for\
            \ this row. On a sale, an adjustment or a dispute adjustment it is the\
            \ shopper's payment. On a refund it is the provider's transaction for\
            \ the refund."
        payment_provider:
          type: string
          description: The payment provider that processed the payment this row belongs
            to.
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        status:
          type: string
          description: "Where the row's amount stands in being paid to the party's\
            \ payout account, which comes before a payout. A row on a payout can still\
            \ be {PENDING}, and some rows have no status."
          enum:
          - SENT
          - REVERSED
          - PARTIALLY_REVERSED
          - PENDING
          - FAILED
          - BYPASSED
          - PARTIALLY_SENT
          - QUEUED
        bag_id:
          type: integer
          description: Unique identifier of the Bag associated with this Distribution.
          format: int64
        bag_sub_total:
          type: integer
          description: "The price of the bag's items before discounts, shipping, duties,\
            \ taxes and tips, in the smallest unit of the currency, for example cents.\
            \ The same on every row of the bag."
          format: int32
        bag_commissionable_amount:
          type: integer
          description: "The amount commission was calculated on: the bag's goods after\
            \ discounts, excluding shipping, duties and tax charged on top of the\
            \ goods, and excluding VAT included in the goods' prices where the merchant\
            \ has a tax-inclusive profile. Any transaction fee deducted before commission\
            \ is also taken off it. On a bag whose totals are net of commission (totals_include_commission\
            \ is false), it is the goods as they were before that commission was deducted,\
            \ after discounts. May be null on a row recorded before this figure was\
            \ stated on it, or whose sale row has none."
          format: int32
        bag_shipping_total:
          type: integer
          description: "The sum of all shipping methods applied to the bag, in the\
            \ smallest unit of the currency, for example cents. The same on every\
            \ row of the bag."
          format: int32
        bag_tax_total:
          type: integer
          description: "The sum of all the taxes applied to the bag, in the smallest\
            \ unit of the currency, for example cents. The same on every row of the\
            \ bag."
          format: int32
        bag_duty_total:
          type: integer
          description: "The sum of all the duties applied to the bag, in the smallest\
            \ unit of the currency, for example cents. The same on every row of the\
            \ bag."
          format: int32
        bag_discount_total:
          type: integer
          description: "The total discounts applied to the price of the bag, in the\
            \ smallest unit of the currency, for example cents. The same on every\
            \ row of the bag."
          format: int32
        bag_total:
          type: integer
          description: "The sum of all item prices, discounts, shipping, duties and\
            \ taxes applied to the bag, in the smallest unit of the currency, for\
            \ example cents. Where the bag's totals are net of commission (`totals_include_commission`\
            \ is false), it is the total after the commission was deducted. The same\
            \ on every row of the bag."
          format: int32
        gross_subtotal:
          type: integer
          description: "The bag's subtotal before the channel's commission was deducted,\
            \ in the smallest unit of the currency, for example cents. The same as\
            \ `bag_sub_total`, except where the bag's totals are net of commission\
            \ (`totals_include_commission` is false): there it is worked back up to\
            \ what the subtotal was before the commission was deducted. Sale, adjustment\
            \ and dispute adjustment rows have it; most refund rows do not."
          format: int32
        gross_total:
          type: integer
          description: "The bag's total before the channel's commission was deducted,\
            \ in the smallest unit of the currency, for example cents. The same as\
            \ `bag_total`, except where the bag's totals are net of commission (`totals_include_commission`\
            \ is false): there it is worked back up to what the total was before the\
            \ commission was deducted. Sale, adjustment and dispute adjustment rows\
            \ have it; most refund rows do not."
          format: int32
        totals_include_commission:
          type: boolean
          description: "Whether the bag's totals include the channel's commission.\
            \ True for most bags: the totals are what the shopper paid, and the commission\
            \ is taken from the merchant's share. False where the channel deducted\
            \ its commission before the bag's totals were set: the totals are net\
            \ of commission, the commission figures on the rows show what the channel\
            \ collected itself and are not taken from the merchant's amount, and refunds\
            \ of the bag reverse no commission. Rows written before this was recorded\
            \ don't have it and are treated as true."
        external_order_id:
          type: string
          description: Unique identifier of the Order in the external ecommerce platform
            (e.g. Shopify) that this Distribution is associated with.
        order_id:
          type: integer
          description: Unique identifier of the Order in Violet associated with this
            Distribution.
          format: int64
        order_total:
          type: integer
          description: "Total of the order, across all of its bags, in the smallest\
            \ unit of the order's currency, for example cents. The same on every row\
            \ of the order."
          format: int32
        payout_id:
          type: integer
          description: Unique identifier of the Payout associated with this Distribution.
          format: int32
        payout_amount:
          type: integer
          description: "The amount of the whole payout this row is part of, in the\
            \ smallest unit of the payout's currency. The same on every row of the\
            \ payout, so don't add it up across rows."
          format: int64
        payout_date:
          type: string
          description: Time at which the Payout was created. In ISO-8601 format.
          format: date-time
        date_payout_created:
          type: string
          description: Time at which the Payout associated with this distribution
            was created. In ISO-8601 format.
          format: date-time
        date_payout_settled:
          type: string
          description: "Time at which the payout this row is part of settles in the\
            \ bank account it is paid to. If this date is in the future, it is a tentative\
            \ date of settlement and subject to change. In ISO-8601 format."
          format: date-time
        payout_transfer_id:
          type: integer
          description: Unique identifier of the Transfer associated with this Distribution.
          format: int64
        refund_id:
          type: integer
          description: "Unique identifier of the Refund associated with this Distribution,\
            \ if any."
          format: int64
        adjustment_id:
          type: integer
          description: Unique identifier of the bag adjustment this row records. Only
            adjustment rows have it.
          format: int64
        platform_code:
          type: string
          description: "Developer-specified identifier for the payment platform that\
            \ processed this Distribution (e.g., 'ACME_UK', 'ACME_US'). Populated\
            \ at runtime from the associated payment platform connection. Null for\
            \ distributions created before multi-platform support."
          readOnly: true
        refund_discrepancy:
          type: integer
          description: "By how much the merchant's refund was more than the line items\
            \ it listed, as a negative amount in the smallest unit of the currency,\
            \ for example cents. Only refund rows have it, and only when the refund\
            \ was larger than its items. It is recorded as the merchant's platform\
            \ sent it and is not converted to the currency of the row. The channel's\
            \ row of the refund can carry a correction for it."
          format: int32
        idempotency_key:
          type: string
          description: "A key Violet sets on adjustment and dispute adjustment rows\
            \ so that the same adjustment or dispute is not recorded twice. Sale and\
            \ refund rows do not have one, except a sale row that is being held, which\
            \ carries a marker giving the reason it is held."
        bag_transaction_fee_id:
          type: integer
          description: Unique identifier of the transaction fee submitted for this
            bag that was applied to this row.
          format: int64
        transaction_fee_total_amount:
          type: integer
          description: "Total of the transaction fee applied to this row's bag, in\
            \ the smallest unit of the currency, for example cents. A positive figure,\
            \ the same on the merchant's row and the channel's row. Refund rows show\
            \ the figure from their sale. Adjustment and dispute adjustment rows do\
            \ not have it."
          format: int32
        transaction_fee_percentage_amount:
          type: integer
          description: "Percentage-based part of the transaction fee, in the smallest\
            \ unit of the currency, for example cents. Positive. On the same rows\
            \ as `transaction_fee_total_amount`."
          format: int32
        transaction_fee_fixed_amount:
          type: integer
          description: "Fixed part of the transaction fee, in the smallest unit of\
            \ the currency, for example cents. Positive. On the same rows as `transaction_fee_total_amount`."
          format: int32
        fee_source_mode:
          type: string
          description: "Fee source mode that was active when this Distribution was\
            \ created. One of APP_PROVIDED, PAYMENT_PROVIDER_ACTUAL, or VIOLET_CONFIGURED."
        deduct_transaction_fees_before_commission:
          type: boolean
          description: Snapshot of the resolved deduct-transaction-fees-before-commission
            (Net Receipts) setting that was active when this Distribution was created.
            Null for rows generated before Net Receipts stamping and for non-fee bags.
        transaction_fee_remitter:
          type: string
          description: "Snapshot of the resolved transaction fee remitter that was\
            \ active when this Distribution was created. One of {APP} or {MERCHANT}.\
            \ Null for rows generated before Net Receipts stamping and for non-fee\
            \ bags."
          enum:
          - APP
          - MERCHANT
        return_commission_policy:
          type: string
          description: "The return commission policy the sale was made under: {REVERSE},\
            \ where a refund takes back the commission on the part of the sale it\
            \ refunds, or {RETAIN}, where the channel keeps its commission on refunds.\
            \ Refund, adjustment and dispute adjustment rows show the policy of their\
            \ sale. Under {RETAIN}, a refund's `commission_reversed_amount` is 0 and\
            \ `commission_retained_amount` holds the commission the channel kept;\
            \ under {REVERSE}, `commission_reversed_amount` holds the commission taken\
            \ back and `commission_retained_amount` is not present. `commission` is\
            \ the whole sale's commission under either policy. Sales made before the\
            \ policy was recorded don't show it and are treated as {REVERSE}."
          nullable: true
          enum:
          - REVERSE
          - RETAIN
        tax_remitter:
          type: string
          description: "Who remits the tax on this bag: {APP}, the channel, or {MERCHANT}.\
            \ The remitter's row shows the tax in `tax_amount`."
          enum:
          - APP
          - MERCHANT
        duty_remitter:
          type: string
          description: "Who remits the duty on this bag: {APP}, the channel, or {MERCHANT}.\
            \ The remitter's row shows the duty in `duty_amount`."
          enum:
          - APP
          - MERCHANT
        date_created:
          type: string
          description: Time at which the row was created. A sale row carries the date
            its bag was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the row was last modified. Adding the row to
            a payout does not change it. In ISO-8601 format.
          format: date-time
        payment_service:
          type: string
          description: "Deprecated: the same value as payment_provider."
          deprecated: true
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        payment_service_total_fee:
          type: integer
          description: "Deprecated: the same value as payment_provider_total_fee."
          format: int32
          deprecated: true
        payment_service_volume_fee:
          type: integer
          description: "Deprecated: the same value as payment_provider_volume_fee."
          format: int32
          deprecated: true
        payment_service_fixed_fee:
          type: integer
          description: "Deprecated: the same value as payment_provider_fixed_fee."
          format: int32
          deprecated: true
        external_transaction_id:
          type: string
          description: "Deprecated: the same value as payment_provider_transaction_id."
          deprecated: true
        commission_reversed_amount:
          type: integer
          description: "The part of the sale's commission that this refund reversed,\
            \ in the smallest unit of the currency, for example cents: the commission\
            \ portion of what actually moved. Same sign as `commission` on the same\
            \ row: positive on the merchant's row, negative on the channel's. 0 when\
            \ the refund reverses no commission: where the channel keeps its commission\
            \ on refunds (a retain return policy), or where the bag's commission was\
            \ deducted before payment (`totals_include_commission` is false). Because\
            \ it is the amount that moved, it is not strictly bounded by `commission`:\
            \ currency conversion can put it a cent above. Present only on refund\
            \ rows. Refunds made before 2 October 2026 don't have it unless it has\
            \ been filled in."
          format: int32
          nullable: true
        commission_retained_amount:
          type: integer
          description: "On a refund under a retain return policy, the commission the\
            \ channel kept instead of reversing, in the smallest unit of the currency,\
            \ for example cents. Same sign as `commission_reversed_amount` on the\
            \ same row: positive on the merchant's row, negative on the channel's.\
            \ Present only on refund rows of a sale made under a retain return policy."
          format: int32
          nullable: true
        payment_platform_connection_id:
          type: integer
          description: Unique identifier of the payment platform connection that processed
            the payment this row belongs to. The merchant's row and the channel's
            row both carry it.
          format: int64
      description: "One party's share of a bag's sale, refund, adjustment or dispute\
        \ adjustment. A sale or a refund gives the merchant a row and the channel\
        \ a row. An adjustment or dispute adjustment gives a row to each party it\
        \ affects. The channel's rows have `payout_account_type` {DEVELOPER} and the\
        \ merchant's have {MERCHANT}. Amounts are whole numbers in the smallest unit\
        \ of the currency in the `currency` field, for example cents. A figure that\
        \ adds to what the row's party is owed is positive, and one that takes from\
        \ it is negative, unless its description says otherwise. The figures about\
        \ the bag or the order (`bag_sub_total`, `bag_commissionable_amount`, `bag_shipping_total`,\
        \ `bag_tax_total`, `bag_duty_total`, `bag_discount_total`, `bag_total`, `gross_subtotal`,\
        \ `gross_total` and `order_total`) are the same on every row for that bag\
        \ or order, so don't add them up across rows. On a refund row they show the\
        \ bag as it was when the refund was made. Fields with no value are left out\
        \ of the response."
    PageDistribution:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        first:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        pageable:
          $ref: '#/components/schemas/Pageable'
        numberOfElements:
          type: integer
          format: int32
        last:
          type: boolean
        empty:
          type: boolean
    Payout:
      type: object
      properties:
        id:
          type: integer
          description: ID
          format: int32
        payout_account_id:
          type: integer
          description: ID of the payout account this payout was made to.
          format: int32
        payout_account_type:
          type: string
          description: Payout Account Type
          enum:
          - MERCHANT
          - DEVELOPER
        amount:
          type: integer
          description: "Total amount of the payout, in the smallest unit of currency\
            \ (for example, cents)."
          format: int64
        currency:
          type: string
          description: Currency that the payout was made in
        status:
          type: string
          description: "Current state of the payout: PAID, PENDING, IN_TRANSIT, CANCELED\
            \ or FAILED. EXTERNAL marks payouts recorded outside Violet and is never\
            \ returned to merchants or channels."
          enum:
          - PAID
          - PENDING
          - IN_TRANSIT
          - CANCELED
          - FAILED
          - EXTERNAL
        payment_service:
          type: string
          description: Payment service that processed this payout
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        external_id:
          type: string
          description: "ID of the payout at the payment provider. For Stripe, the\
            \ po_ id."
        summary:
          $ref: '#/components/schemas/PayoutSummary'
        date_created:
          type: string
          description: Date of payout creation
          format: date-time
        date_settled:
          type: string
          description: "Date the payout settles in your bank account. If this date\
            \ is in the future, this is a tentative date of settlement and subject\
            \ to change."
          format: date-time
        date_last_modified:
          type: string
          description: Date of last payout update
          format: date-time
      description: Payouts to a given payout account
    PayoutSummary:
      type: object
      properties:
        id:
          type: integer
          description: ID of the payout summary.
          format: int32
        payments_order_volume:
          type: integer
          description: "Total value of the bags whose sales are settled in this payout,\
            \ in the smallest unit of the currency the sales were made in. Each bag\
            \ is counted at its full total, on both the merchant's and the channel's\
            \ payout. This is what the shopper paid for the bag, not this account's\
            \ share."
          format: int32
        payments_commission:
          type: integer
          description: "Channel commission on the sales in this payout. Negative on\
            \ a merchant's payout, where it is taken from the merchant's sales, and\
            \ positive on a channel's payout, where it is earned. 0 when no commission\
            \ applies."
          format: int32
        payments_fees:
          type: integer
          description: "Payment provider fees on the sales in this payout that this\
            \ account pays, as a positive amount. Depending on how fees are split\
            \ between the merchant and the channel, this can be 0 on either payout."
          format: int32
        payments_distributions:
          type: integer
          description: "What this account is owed from the sales in this payout. Positive\
            \ on a merchant's payout. On a channel's payout it can be negative, when\
            \ the provider fees the channel pays are larger than the commission it\
            \ earns."
          format: int32
        refunds_order_volume:
          type: integer
          description: "Total value of the bags refunded in this payout. Each refunded\
            \ bag counts once, at its full total, even when only part of it was refunded,\
            \ so this is not the amount refunded."
          format: int32
        refunds_commission:
          type: integer
          description: "Commission returned by the refunds in this payout. Positive\
            \ on a merchant's payout and negative on a channel's, the opposite sign\
            \ of `payments_commission`. 0 when the refunds return no commission, for\
            \ example when the channel keeps its commission on refunds. For refunds\
            \ made before 2 October 2026, this can be the whole sale's commission\
            \ rather than the part the refund returned."
          format: int32
        refunds_fees:
          type: integer
          description: "Payment provider fees on the refunds in this payout. 0 for\
            \ refunds made on or after 27 October 2026. Refunds made before then can\
            \ show a negative figure: a fee credit worked out by Violet, not a fee\
            \ the provider returned."
          format: int32
        refunds_distributions:
          type: integer
          description: "What the refunds in this payout took from this account, as\
            \ a negative amount or 0. On a channel's payout, refunds made before 27\
            \ October 2026 can show a positive figure."
          format: int32
        net_amount:
          type: integer
          description: "`payments_distributions` plus `refunds_distributions`: what\
            \ this account is owed from the sales and refunds in this payout. Negative\
            \ when refunds outweigh sales. Adjustments and disputes settled in the\
            \ same payout are not included, so this can differ from the payout amount."
          format: int32
        unknown_amount:
          type: integer
          description: "Charges in this payout that can't be tied to a Violet order,\
            \ less refunds of such charges, in the smallest unit of the currency the\
            \ provider charged in. Positive or negative. This is the provider's full\
            \ charge or refund amount, not only the part that reached this payout."
          format: int32
        date_created:
          type: string
          description: Date of when this summary was created.
          format: date-time
        date_last_modified:
          type: string
          description: Date of when this summary was last updated.
          format: date-time
      description: "Totals for the sales and refunds settled in this payout, for the\
        \ account the payout was made to. Amounts are whole numbers in the smallest\
        \ unit of the currency the sales were made in, except `unknown_amount`, which\
        \ is in the currency the provider charged in. Apart from `net_amount`, these\
        \ are separate totals and don't add up to each other or to the payout amount."
    PagePayout:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        first:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        pageable:
          $ref: '#/components/schemas/Pageable'
        numberOfElements:
          type: integer
          format: int32
        last:
          type: boolean
        empty:
          type: boolean
    PayoutTransfer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        payment_transaction:
          type: integer
          description: Unique identifier of the Payment Transaction that this Transfer
            is associated with.
          format: int64
        payout_id:
          type: integer
          description: "ID of the Payout, if any, this Transfer is associated to"
          format: int32
        payment_provider_id:
          type: string
          description: ID of the transfer record in Stripe
        payment_provider_payout_id:
          type: string
          description: External ID of the payout record
        payout_account_id:
          type: integer
          description: ID of the Payout Account this Transfer belongs to.
          format: int32
        bag_amount:
          type: integer
          description: Total value for the bag associated to this transfer
          format: int32
        bag_currency:
          type: string
          description: Original currency that this bag was processed in.
        amount:
          type: integer
          description: Total amount in fractional currency unit (e.g. cents) for this
            transfer.
          format: int32
        currency:
          type: string
          description: Currency that this transfer was processed in.
        status:
          type: string
          description: Status of the transfer.
          enum:
          - SENT
          - REVERSED
          - PARTIALLY_REVERSED
          - PENDING
          - FAILED
          - BYPASSED
          - PARTIALLY_SENT
          - QUEUED
        type:
          type: string
          description: Account type of the Transfer recipient.
          enum:
          - MERCHANT
          - DEVELOPER
        payment_provider:
          type: string
          description: Payment Provider that this transfer is executed with. This
            is the provider that handles transfer processing for this payout account.
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        idempotency_key:
          type: string
          description: Unique key to prevent duplicate transfers. This is generated
            by the Violet and unique for each transfer being processed.
        transfer_mechanism:
          type: string
          description: "Mechanism used to execute this transfer. STANDARD_TRANSFERS\
            \ uses /v1/transfers API, DESTINATION_PAYMENTS uses Payment Intent with\
            \ transfer_data.destination. This is stored at creation time to prevent\
            \ configuration race conditions."
          enum:
          - STANDARD_TRANSFERS
          - DESTINATION_PAYMENTS
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
        errors:
          uniqueItems: true
          type: array
          description: List of errors associated to this payout transfer during processing..
            This value will only be populated if there are errors during processing
          items:
            $ref: '#/components/schemas/PayoutTransferError'
        externalId:
          type: string
        payoutExternalId:
          type: string
        paymentService:
          type: string
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        effectiveRelatedOrderIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        effectiveRelatedBagIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        effectiveRelatedDistributionIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        effectiveTransferReversalIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        related_orders:
          uniqueItems: true
          type: array
          description: "DEPRECATED: Use related_order_ids instead. Identifiers of\
            \ the Orders in Violet that are associated with this transfer."
          deprecated: true
          items:
            type: string
            description: "DEPRECATED: Use related_order_ids instead. Identifiers of\
              \ the Orders in Violet that are associated with this transfer."
            deprecated: true
        related_bags:
          uniqueItems: true
          type: array
          description: "DEPRECATED: Use related_bag_ids instead. Identifiers of the\
            \ Bags in Violet that are associated with this transfer."
          deprecated: true
          items:
            type: string
            description: "DEPRECATED: Use related_bag_ids instead. Identifiers of\
              \ the Bags in Violet that are associated with this transfer."
            deprecated: true
        related_distributions:
          uniqueItems: true
          type: array
          description: "DEPRECATED: Use related_distribution_ids instead. Identifiers\
            \ of the Distributions in Violet that are associated with this transfer."
          deprecated: true
          items:
            type: string
            description: "DEPRECATED: Use related_distribution_ids instead. Identifiers\
              \ of the Distributions in Violet that are associated with this transfer."
            deprecated: true
        transfer_reversals:
          uniqueItems: true
          type: array
          description: "DEPRECATED: Use transfer_reversal_ids instead. Unique identifiers\
            \ of the Transfer Reversal objects in Violet that are associated with\
            \ this transfer."
          deprecated: true
          items:
            type: string
            description: "DEPRECATED: Use transfer_reversal_ids instead. Unique identifiers\
              \ of the Transfer Reversal objects in Violet that are associated with\
              \ this transfer."
            deprecated: true
        related_order_ids:
          uniqueItems: true
          type: array
          description: Identifiers of the Orders in Violet that are associated with
            this transfer.
          items:
            type: integer
            description: Identifiers of the Orders in Violet that are associated with
              this transfer.
            format: int64
        related_bag_ids:
          uniqueItems: true
          type: array
          description: Identifiers of the Bags in Violet that are associated with
            this transfer.
          items:
            type: integer
            description: Identifiers of the Bags in Violet that are associated with
              this transfer.
            format: int64
        related_distribution_ids:
          uniqueItems: true
          type: array
          description: Identifiers of the Distributions in Violet that are associated
            with this transfer. The amount of this Transfer is directly computed as
            the sum of all Distributions related to it.
          items:
            type: integer
            description: Identifiers of the Distributions in Violet that are associated
              with this transfer. The amount of this Transfer is directly computed
              as the sum of all Distributions related to it.
            format: int64
        transfer_reversal_ids:
          uniqueItems: true
          type: array
          description: Unique identifiers of the Transfer Reversal objects in Violet
            that are associated with this transfer.
          items:
            type: integer
            description: Unique identifiers of the Transfer Reversal objects in Violet
              that are associated with this transfer.
            format: int64
      description: Record of Payout Transfer
    PayoutTransferError:
      required:
      - error_message
      - payout_transfer_id
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the object.
          format: int64
          readOnly: true
        error_code:
          type: integer
          description: Unique error code corresponding to this error.
          format: int32
        error_message:
          type: string
          description: Error message describing the issue in the underlying system.
        resolved:
          type: boolean
          description: Indicates whether the error has been resolved. Defaults to
            false.
        date_resolved:
          type: string
          description: "Time at which this error was resolved. In ISO-8601 format.\
            \ By default, this value is null and only applies to "
          format: date-time
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        payout_transfer_id:
          type: integer
          description: ID of the Payout Transfer this Error is associated to
          format: int64
      description: Error associated to a payout transfer
    TransferReversal:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        object:
          type: string
          description: Name of the object that this object represents. This value
            will always be `transfer_reversal`.
        transfer:
          type: integer
          description: Unique identifier for the transfer object that was reversed.
          format: int64
        status:
          type: string
          description: Status of the transfer.
          enum:
          - PENDING
          - COMPLETE
          - FAILED
        amount:
          type: integer
          description: "Amount, in fractional currency unit (e.g. cents), that was\
            \ reversed."
          format: int64
        currency:
          type: string
          description: Main currency (e.g. USD) of this transfer reversal.
        paypro:
          type: string
          description: Payment provider that processed this transfer reversal.
          enum:
          - STRIPE
          - NUVEI
          - CREDOVA
          - EXTERNAL
        paypro_data:
          type: object
          additionalProperties:
            type: object
            description: Additional data about this transfer reversal directly from
              the payment provider.
          description: Additional data about this transfer reversal directly from
            the payment provider.
        errors:
          uniqueItems: true
          type: array
          description: List of errors associated to this transfer reversal. This value
            will only be populated if there are errors during processing.
          items:
            $ref: '#/components/schemas/TransferReversalError'
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
      description: "Represents details of a reversal applied to a previously initiated\
        \ transfer, including status, amount, and reason for the reversal."
    TransferReversalError:
      required:
      - error_message
      - transfer_reversal_id
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the object.
          format: int64
          readOnly: true
        error_code:
          type: integer
          description: Unique error code corresponding to this error.
          format: int32
