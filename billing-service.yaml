        \ accounts for its own app, and no other payout of the merchant's. A channel\
        \ reading a merchant's payout is given only the distributions of its own app.\
        \ Distributions come oldest first by creation date, and distributions created\
        \ at the same moment come lowest id first, so the order is the same on every\
        \ page. A payout that does not exist and a payout you may not read give the\
        \ same 404, payout_not_found, so the answer does not reveal whether someone\
        \ else's payout exists. A payout with status EXTERNAL is never returned to\
        \ a merchant or a channel: it answers 404, as a payout that does not exist\
        \ does. A payout with no distributions for you returns an empty page, not\
        \ a 404."
