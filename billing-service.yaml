          content:
            application/json:
              examples:
                Distribution Not Found:
                  description: Distribution Not Found
                  value:
                    message: "Distribution with ID {12345} not found"
        "403":
          description: Forbidden - Account does not have access to this distribution
          content:
            application/json:
              examples:
                Access Denied:
                  description: Access Denied
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
