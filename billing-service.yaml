                  value:
                    content:
                    - id: 7301
                      payout_account_id: 5678
                      payout_account_type: MERCHANT
                      amount: 34200
                      currency: USD
                      status: PAID
                      payment_service: STRIPE
                      external_id: po_1PqV3dK29KDiBVldXmN4tR8s
                      summary:
                        id: 5120
                        payments_order_volume: 50000
                        payments_commission: -5000
                        payments_fees: 0
                        payments_distributions: 45000
                        refunds_order_volume: 50000
                        refunds_commission: 1200
                        refunds_fees: 0
                        refunds_distributions: -10800
                        net_amount: 34200
