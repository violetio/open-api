  /payments/{account_type}/{account_id}/payouts/search:
    post:
      tags:
      - Payments - Payouts
      summary: Search Payouts
      description: "Returns the payouts of the merchant or channel named in the path\
        \ that match every filter in the body. Use it to find the payouts that hold\
        \ the money of one order or bag, or the payouts of a period. Filters combine\
        \ with AND, an omitted field does not filter, and {} matches every payout\
        \ the caller can see. A merchant reads its own payouts, whichever app they\
        \ came through. A channel reads either its own payouts, with account_type\
        \ developer, or the payouts of a merchant that its app is, or has been, connected\
        \ to, with account_type merchant. Of such a merchant a channel sees the payouts\
        \ made to the merchant's payout accounts for its own app, and no other payout\
        \ of the merchant's. Payouts come newest first by creation date, and payouts\
        \ created at the same moment come highest id first, so the order is the same\
        \ on every page. A payout with status EXTERNAL is never returned to a merchant\
        \ or a channel, and a search for that status matches nothing. amount is the\
        \ payout to the merchant's bank account, in the smallest unit of its currency\
        \ (cents, for USD); on a channel's own payouts it is the payout to the channel's\
        \ bank account. A search that matches nothing returns an empty page, not a\
        \ 404."
      operationId: searchPayouts
      parameters:
      - name: X-Violet-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        required: true
        schema:
          type: integer
          format: int32
      - name: account_type
        in: path
        description: "Whose payouts to read: merchant, or developer for a channel's\
          \ own payouts. Case-insensitive; any other value is refused with 400 invalid_parameter."
        required: true
        schema:
          type: string
          enum:
          - merchant
          - developer
      - name: account_id
        in: path
        description: "The merchant id when account_type is merchant, or the channel's\
          \ developer id when it is developer. A merchant uses its own id. A channel\
          \ uses its own developer id, or the id of a merchant its app is, or has\
          \ been, connected to."
        required: true
        schema:
          type: integer
          format: int32
      - name: app_id
        in: query
        description: "The app to read for. Required when a channel reads a merchant's\
          \ payouts through Violet's own dashboard, which serves every channel and\
          \ so has to be told which one is meant: without it the answer is 400 missing_parameter,\
          \ and the app has to be one the caller owns, or the answer is 403. Ignored\
          \ in every other call, where the app is the one the credentials belong to."
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: "Results per page, at most 100. Out-of-range values are adjusted\
          \ rather than refused: above 100 becomes 100, and below 1 becomes 10. The\
          \ size applied is returned in the response's size. (Violet's own dashboard\
          \ has a ceiling of 500.)"
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        description: "Page to return, counting from 1. Values below 1 become 1. The\
          \ response's number counts from 0, so page 1 comes back as number 0."
        schema:
          type: integer
          format: int32
          default: 1
      requestBody:
        description: "The filters, all optional. Send {} to search without filters.\
          \ The dates are inclusive and must be written with a numeric offset, as\
          \ 2026-09-01T00:00:00+0000: the forms 2026-09-01T00:00:00Z and 2026-09-01T00:00:00+00:00\
          \ are refused."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutSearchRequest'
            examples:
              Every payout for one order:
                description: Every payout for one order
                value:
                  order_id: 54609
              Paid payouts settled in September 2026:
                description: Paid payouts settled in September 2026
                value:
                  statuses:
                  - PAID
                  after_date_settled: 2026-09-01T00:00:00+0000
                  before_date_settled: 2026-09-30T23:59:59+0000
        required: true
