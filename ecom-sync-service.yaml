          format: int32
          nullable: true
          readOnly: true
        rate:
          type: number
          description: Rate. *This value can be null.*
          format: double
          nullable: true
          readOnly: true
        type:
          type: string
          description: Rate Type
          readOnly: true
          enum:
          - TAX
          - SHIPPING
          - FEE
          - DUTY
        name:
          type: string
          description: Rate Name
          readOnly: true
        decimal_rate:
          type: number
          format: double
          readOnly: true
        dollar_amount:
          type: number
          format: double
          readOnly: true
      description: Rates belonging to Order SKUs
      nullable: true
      readOnly: true
    OrderTax:
      required:
      - amount
      - merchant_id
      - order_id
      - rate
      - state
      type: object
      properties:
        order_id:
          type: integer
          description: ID of the Order the Tax belongs to
          format: int64
          readOnly: true
        merchant_id:
          type: integer
          description: ID of the Merchant the Bag belongs to
          format: int32
          readOnly: true
        skus:
          type: array
          description: SKUs covered by the Tax
          nullable: true
          readOnly: true
          items:
            type: string
            description: SKUs covered by the Tax
            nullable: true
            readOnly: true
        state:
          type: string
          description: State abbreviation
          readOnly: true
        postal_code:
          type: string
          description: Postal/Zip Code
          nullable: true
          readOnly: true
        rate:
          type: number
          description: Tax Rate. *This value can be null.*
          format: double
          nullable: true
          readOnly: true
        amount:
          type: integer
          description: Total Tax amount on Bag. In Cents. *This value can be null.*
          format: int32
          nullable: true
          readOnly: true
        description:
          maxLength: 255
          minLength: 0
          type: string
          description: Description of the Tax
          nullable: true
          readOnly: true
      description: Taxes belonging to an Order Bag
      nullable: true
    PaymentTransaction:
      required:
      - amount
      - capture_method
      - capture_status
      - currency
      - date_created
      - date_last_modified
      - dispute_status
      - errors
      - id
      - order_id
      - payment_provider
      - payment_provider_transaction_id
      - related_bags
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the object
          format: int64
          readOnly: true
        order_id:
          type: integer
          description: Identifier of the Order entity that this payment transaction
            is associated with
          format: int64
          readOnly: true
        payment_provider:
          type: string
          description: Payment Provider that this transaction is executed against.
            This is the provider that handles payment processing for this transaction.
          readOnly: true
        payment_provider_transaction_id:
          type: string
          description: Identifier of the payment transaction in the underlying payment
            provider system.
          readOnly: true
        payment_method_id:
          type: integer
          description: 'Identifier of the payment method associated with this payment
            transaction in Violet. '
          format: int64
          nullable: true
          readOnly: true
        payment_provider_payment_method_id:
          type: string
          description: 'Identifier of the payment method associated with this payment
            transaction in the underlying payment provider system. '
          nullable: true
          readOnly: true
        payment_intent_client_secret:
          type: string
          description: Client secret for the payment intent associated to this payment
            transaction
          nullable: true
          readOnly: true
        amount:
          type: integer
          description: 'Amount of this payment in the fractional currency unit of
            this transaction (e.g. cents). This is the amount charged to the shopper. '
          format: int32
          readOnly: true
        currency:
          type: string
          description: Currency that the amount of this payment transaction is reflected
            in. This is the currency that the payment provider uses to charge the
            shopper payment method.
          readOnly: true
        capture_status:
          type: string
          description: Underlying status of the payment capture in the payment provider
            system and should be used to determine what action to take next against
            this payment transaction.
          readOnly: true
          enum:
          - PROCESSING
          - CAPTURED
          - CANCELLED
          - FAILED
          - BYPASSED
          - REQUIRES_ACTION
          - REQUIRES_PAYMENT_METHOD
          - REQUIRES_AUTHORIZATION
          - AUTHORIZED
          - REFUNDED
          - PARTIALLY_REFUNDED
          - NOT_REQUIRED
        capture_method:
          type: string
          description: Method used to capture the payment in the payment provider
            system. Determines how and when the payment is captured.
          readOnly: true
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        transfer_status:
          type: string
          description: Status of the transfer of distributions associated with this
            payment transaction.
          nullable: true
          readOnly: true
          enum:
          - SENT
          - REVERSED
          - PARTIALLY_REVERSED
          - PENDING
          - FAILED
          - BYPASSED
          - PARTIALLY_SENT
          - QUEUED
        transfer_method:
          type: string
          description: Method used for transferring distributions associated with
            this payment transaction.
          nullable: true
          readOnly: true
          enum:
          - AUTOMATIC
          - CUSTOM
          - DISABLED
          - EXTERNAL
        dispute_status:
          type: string
          description: Dispute status of this payment transaction. Orthogonal to capture_status
            — a transaction can be CAPTURED and IN_DISPUTE simultaneously.
          readOnly: true
          default: UNDISPUTED
          enum:
          - UNDISPUTED
          - IN_DISPUTE
          - DISPUTE_WON
          - DISPUTE_LOST
        metadata:
          type: object
          additionalProperties:
            type: object
            description: Metadata from the payment provider associated to this payment
              transaction
            nullable: true
            readOnly: true
          description: Metadata from the payment provider associated to this payment
            transaction
          nullable: true
          readOnly: true
        related_bags:
          uniqueItems: true
          type: array
          description: 'Identifiers of the Bags in Violet that are associated with
            this payment transaction. The amount of this payment transaction is directly
            computed from the total amounts on the related bags. '
          readOnly: true
          items:
            type: string
            description: 'Identifiers of the Bags in Violet that are associated with
              this payment transaction. The amount of this payment transaction is
              directly computed from the total amounts on the related bags. '
            readOnly: true
        related_refunds:
          uniqueItems: true
          type: array
          description: Identifiers of the Refunds in Violet that are associated with
            this payment transaction. Refund amounts are not reflected in the amount
            on this payment transaction.
          nullable: true
          readOnly: true
          items:
            type: string
            description: Identifiers of the Refunds in Violet that are associated
              with this payment transaction. Refund amounts are not reflected in the
              amount on this payment transaction.
            nullable: true
            readOnly: true
        errors:
          uniqueItems: true
          type: array
          description: List of errors associated to this payment transaction during
            processing.. This value will only be populated if there are errors during
            processing
          readOnly: true
          items:
            $ref: '#/components/schemas/PaymentTransactionError'
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: Time at which the object was last modified. In ISO-8601 format.
          format: date-time
          readOnly: true
        payment_platform_connection_id:
          type: integer
          description: 'Identifier of the PaymentPlatformConnection used for this
            transaction. This is the immutable reference to the connection configuration
            at the time of payment. '
          format: int64
          nullable: true
          readOnly: true
        status:
          type: string
          enum:
          - PROCESSING
          - CAPTURED
          - CANCELLED
          - FAILED
          - BYPASSED
          - REQUIRES_ACTION
          - REQUIRES_PAYMENT_METHOD
          - REQUIRES_AUTHORIZATION
          - AUTHORIZED
          - REFUNDED
          - PARTIALLY_REFUNDED
          - NOT_REQUIRED
      description: Payment Transaction
      nullable: true
      readOnly: true
    PaymentTransactionError:
      required:
      - error_message
      - payment_transaction_id
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the object.
          format: int64
          readOnly: true
        error_code:
          type: integer
          description: Unique error code corresponding to this error.
          format: int32
        error_message:
          type: string
          description: Error message describing the issue in the underlying system.
        resolved:
          type: boolean
          description: Indicates whether the error has been resolved. Defaults to
            false.
        date_resolved:
          type: string
          description: "Time at which this error was resolved. In ISO-8601 format.\
            \ By default, this value is null and only applies to "
          format: date-time
        date_created:
          type: string
          description: Time at which the object was created. In ISO-8601 format.
          format: date-time
        payment_transaction_id:
          type: integer
          description: Identifier of the PaymentTransaction entity that this error
            is associated with
          format: int64
      description: Error associated to a payment transaction
      readOnly: true
    SkuDiscount:
      required:
      - type
      - value_type
      type: object
      properties:
        sku_id:
          type: integer
          description: ID of the SKU this discount belongs to
          format: int64
        type:
          type: string
          description: Type of discount
          enum:
          - CODE
          - CUSTOM
        amount:
          type: integer
          description: Amount of discount. *This value can be null.*
          format: int32
          nullable: true
        percentage:
          type: number
          description: Percentage of discount. *This value can be null.*
          format: double
          nullable: true
        value_type:
          type: string
          description: Value Type of discount
          enum:
          - AMOUNT
          - PERCENTAGE
      description: "Discount that should be applied to this SKU, if any. Only `CUSTOM`\
        \ discounts can be passed to be applied at the SKU-level."
      nullable: true
    communication_preference_detail:
      type: object
      properties:
        requested:
          type: string
          description: Requested communication preference
          enum:
          - NO_OPT_IN
          - OPT_IN
        result:
          type: string
          description: |-
            Result of email communication preference opt-in.
            OPT_IN: Used for marketing preferences, applies to any future email communication after the order is fulfilled.
            SINGLE_OPT_IN: Used for orderConfirmation and orderFulfillment, applies only to communication about the current order (confirmation/fulfillment).
            UNKNOWN: Used for e-commerce platforms that do not support explicit request parameters for different email communication settings; the use of the email for communication is not known.
          enum:
          - NO_OPT_IN
          - OPT_IN
          - SINGLE_OPT_IN
          - UNKNOWN
      description: Order fulfillment email communication preference detail
    communication_preferences:
      type: object
      properties:
        email_preferences:
          $ref: '#/components/schemas/email_preferences'
      description: Communication preferences requested and resultant states for this
        Bag.
    data:
      type: object
      properties:
        communication_preferences:
          $ref: '#/components/schemas/communication_preferences'
      description: Container for bag-related data stored in JSON format
    email_preferences:
      type: object
      properties:
        marketing:
          $ref: '#/components/schemas/communication_preference_detail'
        order_confirmation:
          $ref: '#/components/schemas/communication_preference_detail'
        order_fulfillment:
          $ref: '#/components/schemas/communication_preference_detail'
    LineItem:
      type: object
      properties:
        quantity:
          type: integer
          description: Number of units refunded.
          format: int32
          example: 1
        amount:
          type: string
          description: "Amount refunded for this line, as a decimal string in the\
            \ order's currency, not cents."
          example: "129.0"
        external_id:
          type: string
          description: ID of the refund line as the platform reports it. BigCommerce
            reports the ID of the refunded order item.
          example: "1234567890123"
        sku_external_id:
          type: string
          description: Not filled yet.
      description: One refunded line of a refund.
    RelayRefund:
      type: object
      properties:
        amount:
          type: string
          description: "Total refunded, as a decimal string in the order's currency,\
            \ not cents. Formatting differs by platform (for example `129.0` or `129.00`)."
          example: "129.0"
        currency:
          type: string
          description: Currency code of the refund. Only filled on Shopify.
          example: USD
        reason:
          type: string
          description: "Reason or note recorded with the refund, if the platform keeps\
            \ one."
          example: Customer returned the item
        external_id:
          type: string
          description: ID of the refund on the merchant's platform.
          example: "929361462325"
        order_id:
          type: string
          description: "ID of the order the refund belongs to, as sent in the request\
            \ path."
          example: "5123456789012"
        created_at:
          type: string
          description: "When the refund was created, as an ISO 8601 timestamp."
          format: date-time
        line_items:
          type: array
          description: "The refunded lines, if the platform reports them."
          items:
            $ref: '#/components/schemas/LineItem'
      description: A refund recorded against an order on the merchant's ecom platform.
    VioletPageOrder:
      type: object
      properties:
        content:
          type: array
          description: The actual content of the response; A list of the result objects
          items:
            $ref: '#/components/schemas/Order'
        last:
          type: boolean
          description: Boolean indicating if this is the last page
        total_pages:
          type: integer
          description: The total count of pages available
          format: int32
        total_elements:
          type: integer
          description: The total count of objects available
          format: int32
        first:
          type: boolean
          description: Boolean indicating if this is the first page of the response
        number_of_elements:
          type: integer
          description: The total number of objects in this specific response
          format: int32
        size:
          type: integer
          description: The page size selected at request time
          format: int32
        number:
          type: integer
          description: The page number selected at request time
          format: int32
        empty:
          type: boolean
          description: Boolean indicating if the response content is empty
        next_page_cursor:
          type: string
          description: Contains the cursor for the next page. This property will only
            be used for situations where the API does not support the page number/page
            size paradigm and it will mutually exclusive with the size/number fields
            in the response. If this property is returned it must be passed when requesting
            the next page from the API. Does not apply to endpoints that do not have
            a next_page_cursor query param documented.
        pageable:
          $ref: '#/components/schemas/VioletPageable'
        sort:
          $ref: '#/components/schemas/VioletSort'
