                      address_1: 123 Example Street
                      address_2: Apt 4
                      city: Springfield
                      state: Illinois
                      country: United States
                      postal_code: "62701"
                      phone: "+15555550100"
                    status: ENABLED
                    date_created: 2025-11-02T09:15:44.000+00:00
                    date_last_modified: 2026-03-04T15:22:10.000+00:00
        "204":
          description: The platform is not supported by this endpoint.
  /relay/merchants/{merchant_id}/customers:
    get:
      tags:
      - Relay
      summary: Relay - Get Customers
      description: |-
        Returns a page of customers from the merchant's ecom platform. Fields the platform does not provide are omitted. `state` and `country` on addresses come back as the platform reports them: Shopify returns names such as `Illinois` and `United States`, not codes.

        Supported platforms: Shopify, BigCommerce, WooCommerce, Magento, Square, Centra, commercetools, Miva and Saleor. On any other platform the response is an empty page.

        Pagination and filters differ by platform. See the Relay overview and the notes on each parameter.
      operationId: getCustomers
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: size
        in: query
        description: "Number of results per page. Values below 1 are treated as 1.\
          \ Violet reduces larger values only where noted below. Elsewhere the value\
          \ is sent on as given and the platform may apply its own limit. Caps: Shopify\
          \ 250, Miva 100. WooCommerce and BigCommerce do not cap customer requests,\
          \ so a large value goes to them unchanged."
        schema:
