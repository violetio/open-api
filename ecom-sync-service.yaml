        seller:
          type: string
          description: Name of the merchant selling product.
          nullable: true
          readOnly: true
          example: Foot Locker
        vendor:
          type: string
          description: Name of the source vendor or brand.
          nullable: true
          readOnly: true
          example: Nike
        merchant_id:
          type: integer
          description: ID of the merchant who sourced this Offer.
          format: int32
        available:
          type: boolean
          description: Is the product currently available for purchase in the merchants
            system.
          readOnly: true
        visible:
          type: boolean
          description: "Is the product visible or hidden in the merchants storefront.\
            \ Note: a product can be hidden while still being available for purchase."
          readOnly: true
        min_price:
          type: integer
          description: Minimum price the Offer sells for in cents. This is the lowest
            of the SKU sale prices (e.g. 2999 = $29.99).
          format: int32
          readOnly: true
          example: 2999
        max_price:
          type: integer
          description: Maximum price the Offer sells for in cents. This is the highest
            of the SKU sale prices (e.g. 5999 = $59.99).
          format: int32
          readOnly: true
          example: 5999
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code for the Offer. By default this value
            will be the merchants currency but can be changed by the API user using
            a `base_currency` parameter.
          example: USD
        external_currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code representing the merchants default currency
            in their external commerce platform.
          nullable: true
          readOnly: true
          example: USD
        source_category_name:
          type: string
          description: Original category name from the merchants external commerce
            platform.
          nullable: true
          readOnly: true
        metadata:
          uniqueItems: true
          type: array
          description: Additional Meta Data of the Offer. Use `?include=metadata`
          nullable: true
          items:
            $ref: '#/components/schemas/MetaObject'
        variants:
          uniqueItems: true
          type: array
          description: "Product option dimensions (e.g. Size, Color) configured by\
            \ the merchant. Each Variant contains a set of VariantValues (e.g. Size\
            \ → Small, Medium, Large). These dimensions combine to form unique SKUs.\
            \ Variant names are merchant-defined and have no pre-defined set of possible\
            \ values."
          readOnly: true
          items:
            $ref: '#/components/schemas/Variant'
        skus:
          uniqueItems: true
          type: array
          description: "The purchasable items within this Offer. Each SKU represents\
            \ a unique combination of Variant values (e.g. Size=Medium + Color=Blue).\
            \ When placing orders, use the SKU `id` to specify which item to purchase.\
            \ Each SKU has its own price, inventory, and availability."
          readOnly: true
          items:
            $ref: '#/components/schemas/Sku'
        albums:
          uniqueItems: true
          type: array
          description: "Grouped media (images, videos) for the Offer. For most commerce\
            \ platforms there will only be a single album per Offer."
          readOnly: true
          items:
            $ref: '#/components/schemas/Album'
        type:
          type: string
          description: Type of product. PHYSICAL products require shipping; DIGITAL
            products do not. Offers with a type of `BUNDLED` cannot be purchased through
            the API at this time due to ecom platform limitations.
          readOnly: true
          enum:
          - PHYSICAL
          - DIGITAL
          - VIRTUAL
          - BUNDLED
        status:
          type: string
          description: Current status of the Offer.
          readOnly: true
          enum:
          - UNAVAILABLE
          - AVAILABLE
          - DISABLED_UNAVAILABLE
          - DISABLED_AVAILABLE
          - FOR_DELETION
          - ARCHIVED
        publishing_status:
          type: string
          description: Whether this Offer has been published to the Violet catalog
            and is discoverable via the Search API. An Offer can be NOT_PUBLISHED
            if the merchant has not yet completed onboarding or has chosen to hide
            it from the catalog.
          readOnly: true
          enum:
          - NOT_PUBLISHED
          - PUBLISHED
        date_created:
          type: string
          description: Date of offer creation in ISO 8601 format.
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: Date of last offer update in ISO 8601 format.
          format: date-time
          readOnly: true
        date_last_consolidated:
          type: string
          description: Date of last consolidation in ISO 8601 format. Consolidation
            is the process of querying the merchants store to see if this product
            still exists. This date is jittered for performance reasons and can be
            in the future.
          format: date-time
          nullable: true
          readOnly: true
        three_d_enabled:
          type: boolean
          description: Is the product 3D Enabled
          nullable: true
          default: false
        three_d_resource:
          type: string
          description: 3D Resource Object
          nullable: true
        commission_rate:
          type: number
          description: "The commission rate the merchant has agreed to share with\
            \ the app on sales of this Offer, expressed as a percentage (e.g. 15.0\
            \ = 15%)."
          format: double
          nullable: true
          readOnly: true
          example: 15.0
        currency_symbol:
          type: string
          description: Symbol representing the desired currency
          nullable: true
        presented_currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code representing the currency that prices
            are displayed in to the end user. May differ from `currency` if currency
            conversion is active.
          nullable: true
          readOnly: true
          example: USD
        default_image_url:
          type: string
          description: The default image for this Offer. Only present on responses
            from the Search API. In other cases this value will be on the album's
            primary media object.
          nullable: true
        subscription_status:
          type: string
          description: Indicates whether the current app is subscribed to this Offer.
            Subscribed offers can be purchased through the API and will appear in
            the app's catalog.
          nullable: true
          readOnly: true
          enum:
          - NOT_SUBSCRIBED
          - SUBSCRIBED
        external_data:
          type: object
          description: The raw external product data from the external commerce platform.
            This data is not pre-processed by Violet and is only provided for reference
            when using using the Violet Relay API.
          nullable: true
        collections:
          uniqueItems: true
          type: array
          description: Collections this offer belongs to. Use `?include=collections`.
          nullable: true
          items:
            $ref: '#/components/schemas/Collection'
        shipping:
          $ref: '#/components/schemas/Shipping'
        tags:
          type: array
          items:
            type: string
      description: "A merchant's product listing synced from an external commerce\
        \ platform. An Offer is the top-level catalog entity and contains one or more\
        \ SKUs (purchasable variations), Variants (product option dimensions like\
        \ Size or Color), and Albums (grouped media/images). Hierarchy: Offer → SKU\
        \ → VariantValues. Use the SKU ID when placing orders. All monetary values\
        \ are in the smallest currency unit (e.g. cents for USD)."
