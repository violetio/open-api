    get:
      tags:
      - Relay
      summary: Relay - Get Order Refunds
      description: |-
        Returns the refunds recorded against an order on the merchant's ecom platform. The response is a JSON array and is not paged. Unlike the order endpoints, `amount` values are decimal strings in the order's currency (for example `129.0`), not cents, and their formatting is not the same on every platform. `currency` is only filled on Shopify, and `sku_external_id` is not filled yet. The order ID must be numeric.

        Supported platforms: Shopify, BigCommerce and WooCommerce. On any other platform the response is 400 `operation_not_supported_exception`.
      operationId: getOrderRefunds
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: order_id
        in: path
        description: ID of the order on the merchant's platform. This is the `external_id`
          of the order's bag.
        required: true
        schema:
          type: string
          example: "5123456789012"
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: The refunds for the order. The array is empty if there are
            none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelayRefund'
              examples:
                shopify:
                  description: shopify
                  value:
                  - external_id: "929361462325"
                    order_id: "5123456789012"
                    amount: "129.0"
                    currency: USD
                    reason: Customer returned the item
                    created_at: 2026-03-06T14:05:12.000+00:00
                    line_items:
                    - external_id: "1234567890123"
                      quantity: 1
                      amount: "129.0"
        "400":
          description: The platform is not supported by this endpoint (`operation_not_supported_exception`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                platform_not_supported:
                  description: platform_not_supported
                  value:
                    message: "Operation not supported. Caused by: Relay order refunds\
                      \ are not currently supported for MAGENTO.."
                    error: operation_not_supported_exception
                    code: 9911
  /relay/merchants/{merchant_id}/orders:
    get:
      tags:
      - Relay
      summary: Relay - Get Orders
      description: |-
        Returns a page of orders from the merchant's ecom platform, in Violet's order model. The platform's own order ID is the `external_id` of the order's bag. Amounts are integer cents, so 12900 is 129.00 in the order's currency.

        Supported platforms: Shopify, BigCommerce, WooCommerce, Magento, Wix, Square, Demandware, Swell, commercetools, Shoptet, Oracle Commerce Cloud, Medusa, Squarespace, Spree, Vendo and Big Cartel. On any other platform the response is an empty page.

        Pagination and filters differ by platform. See the Relay overview and the notes on each parameter.
      operationId: getOrders
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: size
        in: query
        description: "Number of results per page. Values below 1 are treated as 1.\
          \ Violet reduces larger values only where noted below. Elsewhere the value\
          \ is sent on as given and the platform may apply its own limit. Caps: Shopify\
          \ and BigCommerce 250, WooCommerce 100, Shoptet 50."
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        description: "Page number, starting at 1. Used by page-number platforms (for\
          \ example WooCommerce and BigCommerce). Cursor platforms such as Shopify\
          \ ignore it and use `next_page_cursor`."
        schema:
          type: integer
          format: int32
          default: 1
      - name: next_page_cursor
        in: query
        description: "Cursor for the next page, copied from `next_page_cursor` in\
          \ the previous response. Used by cursor platforms such as Shopify. Filters\
          \ sent with a cursor are ignored, because the cursor carries the filters\
          \ of the first request."
        schema:
          type: string
      - name: include
        in: query
        description: Accepted but has no effect.
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search. Applied by WooCommerce only.
        schema:
          type: string
      - name: status
        in: query
        description: "Only return orders with this status. Applied by WooCommerce\
          \ only, which uses it as its own order status filter (for example `processing`\
          \ or `completed`)."
        schema:
          type: string
        example: processing
      - name: financial_status
        in: query
        description: Accepted but not applied by any platform.
        schema:
          type: string
      - name: fulfillment_status
        in: query
        description: Accepted but not applied by any platform.
        schema:
          type: string
      - name: sort
        in: query
        description: Accepted but not applied by any platform. Results come back in
          the platform's default order.
        schema:
          type: string
      - name: sort_order
        in: query
        description: Accepted but not applied by any platform. Results come back in
          the platform's default order.
        schema:
          type: string
      - name: updated_after
        in: query
        description: "Only return orders updated after this time. ISO 8601 timestamp,\
          \ for example `2026-01-15T00:00:00Z`. A date without a time is rejected\
          \ with 400 `invalid_parameter`. Applied by Shopify only."
        schema:
          type: string
      - name: updated_before
        in: query
        description: Accepted but not applied by any platform.
        schema:
          type: string
      - name: created_after
        in: query
        description: "Only return orders created after this time. ISO 8601 timestamp,\
          \ for example `2026-01-15T00:00:00Z`. A date without a time is rejected\
          \ with 400 `invalid_parameter`. Applied by Shopify and WooCommerce."
        schema:
          type: string
      - name: created_before
        in: query
        description: Accepted but not applied by any platform.
        schema:
          type: string
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VioletPageOrder'
              examples:
                cursor_pagination:
                  summary: Cursor pagination (Shopify)
