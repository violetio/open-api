    Bag:
      required:
      - app_id
      - channel
      - commission_rate
      - currency
      - date_created
      - date_last_modified
      - discount_total
      - dispute_status
      - external_checkout
      - external_currency
      - financial_status
      - fulfillment_status
      - id
      - merchant_id
      - merchant_name
      - order_id
      - platform
      - shipping_total
      - skus
      - status
      - sub_total
      - tax_total
      - taxes_included
      - total
      type: object
      properties:
        communicationPreferencesInternal:
          $ref: '#/components/schemas/communication_preferences'
        bag_id:
          type: integer
          format: int64
        bag_status:
          type: string
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - ACCEPTED
          - COMPLETED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - REJECTED
          - CANCELED
        id:
          type: integer
          description: Unique ID of the Bag.
          format: int64
          readOnly: true
        order_id:
          type: integer
          description: ID of the parent order the Bag is a child of.
          format: int64
          readOnly: true
        merchant_id:
          type: integer
          description: ID of the merchant the Bag is related to.
          format: int32
          readOnly: true
        merchant_name:
          type: string
          description: Name of the merchant the Bag is related to.
          readOnly: true
        app_id:
          type: integer
          description: ID of the App responsible for the creation and submission of
            this Order.
          format: int32
          readOnly: true
        external_id:
          type: string
          description: ID of the Order on the external commerce platform. This value
            will be `null` until the Order submitted.
          nullable: true
        external_reference_id:
          type: string
          description: An alternative vanity or reference ID that the external commerce
            platform may use for an order. This is typically an ID or number that
            may be shown to the shopper in communication from the merchant when the
            true order ID is hidden.
          nullable: true
        status:
          type: string
          description: Overall status of the Bag.
          readOnly: true
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - ACCEPTED
          - COMPLETED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - REJECTED
          - CANCELED
        fulfillment_status:
          type: string
          description: Fulfillment status of the Bag.
          readOnly: true
          enum:
          - PROCESSING
          - SHIPPED
          - PARTIALLY_SHIPPED
          - DELIVERED
          - COULD_NOT_DELIVER
          - RETURNED
        financial_status:
          type: string
          description: Financial status of the Bag.
          readOnly: true
          enum:
          - UNPAID
          - AUTHORIZED
          - PENDING
          - PAID
          - PARTIALLY_PAID
          - REFUNDED
          - PARTIALLY_REFUNDED
          - VOIDED
          - DISPUTED_REFUNDED
        dispute_status:
          type: string
          description: Dispute status of the Bag.
          readOnly: true
          default: UNDISPUTED
          enum:
          - UNDISPUTED
          - IN_DISPUTE
          - DISPUTE_WON
          - DISPUTE_LOST
        skus:
          type: array
          description: "Line items (OrderSku objects) that have been added to the\
            \ Bag. Important: when constructing refund requests, use the OrderSku\
            \ `id` (the line item ID within the Bag), not the catalog SKU ID."
          readOnly: true
          items:
            $ref: '#/components/schemas/OrderSku'
        shipping_method:
          $ref: '#/components/schemas/OrderShippingMethod'
        taxes:
          type: array
          description: Tax rates applied to the Bag.
          nullable: true
          items:
            $ref: '#/components/schemas/OrderTax'
        sub_total:
          type: integer
          description: "The price of the Bag in the base currency before discounts,\
            \ shipping, duties, taxes, and tips. In Cents. *This value can be null\
            \ before the cart has been priced.*"
          format: int32
          default: 0
        shipping_total:
          type: integer
          description: The sum of all shipping methods applied to the Bag in the base
            currency. In Cents. May be null before the cart has been priced.
          format: int32
          default: 0
        tax_total:
          type: integer
          description: The sum of all the taxes applied to the Bag in the base currency.
            In Cents. May be null before the cart has been priced.
          format: int32
          default: 0
        discount_total:
          type: integer
          description: The total discounts applied to the price of the Bag in the
            base currency. In Cents. May be null before the cart has been priced.
          format: int32
          default: 0
        duty_total:
          type: integer
          description: "The sum of all duties applied to the Bag in the base currency.\
            \ In Cents. If not provided, this value will be automatically calculated\
            \ from DUTY-type rates on the Bag's SKUs. *This value can be null.*"
          format: int32
          default: 0
        total:
          type: integer
          description: "The sum of all item prices, discounts, shipping, duties, and\
            \ taxes applied to the Bag in the base currency. In Cents. *This value\
            \ can be null before the cart has been priced.*"
          format: int32
          default: 0
        taxes_included:
          type: boolean
          description: Are taxes included in the cart subtotal. When `true` the taxes
            will not be summed separately.
          default: false
        external_checkout:
          type: boolean
          description: "Whether Violet has created a corresponding cart/checkout session\
            \ in the merchant's external commerce platform for this Bag. When true,\
            \ the Bag's items and totals are synced with the external platform."
          readOnly: true
          default: true
        commission_rate:
          type: number
          description: "The commission rate used to calculate the app's earnings for\
            \ this Bag, expressed as a percentage (e.g. 15.0 = 15%). On order creation\
            \ the channel may provide a rate at the bag or SKU level; this field then\
            \ holds the line-total-weighted average of the resolved per-SKU rates."
          format: double
          readOnly: true
          example: 15.0
        commission_rate_source:
          type: string
          description: Provenance of this Bag's commission rate.
          nullable: true
          readOnly: true
          enum:
          - SYSTEM
          - BAG
          - WEIGHTED
        date_created:
          maxLength: 24
          type: string
          description: Date the Bag was created in Violet.
          format: date-time
          readOnly: true
        date_last_modified:
          maxLength: 24
          type: string
          description: Date the Bag was last modified in Violet.
          format: date-time
          readOnly: true
        date_last_consolidated:
          maxLength: 24
          type: string
          description: Date the Bag was last checked for updates. This is a part of
            Order Parity and is used to discover missed or unsent webhooks from the
            external commerce platforms.
          format: date-time
          nullable: true
          readOnly: true
        date_submitted:
          maxLength: 24
          type: string
          description: Date the Bag was submitted to the external commerce platform.
          format: date-time
          nullable: true
          readOnly: true
        remorse_period_ends:
          maxLength: 24
          type: string
          description: Date when the Bag can no longer be refunded.
          format: date-time
          nullable: true
          readOnly: true
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code for the Bag.
          example: USD
        external_currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code of the equivalent cart in the external
            commerce platform.
          readOnly: true
          example: USD
        currency_exchange_rate:
          type: number
          description: "Exchange rate of currency and external currency, if different,\
            \ at the time the Bag was last priced."
          nullable: true
          readOnly: true
        channel:
          type: string
          description: The type of Channel that originated this Bag.
          readOnly: true
          enum:
          - APP
          - MARKETPLACE
          - FACEBOOK
          - INSTAGRAM
          - WALMART
          - GOOGLE
          - TIKTOK
          - SNAPCHAT
          - PINTEREST
        app_order_id:
          maxLength: 64
          type: string
          description: Optional ID of the Order in the channels system. Automatically
            obtained through the app_order_id applied to the Order.
          nullable: true
        platform:
          type: string
          description: The commerce platform used by this merchant.
          readOnly: true
          enum:
          - OTHER
          - SHOPIFY
          - MAGENTO
          - MAGENTO_ONE
          - WOOCOMMERCE
          - BIGCOMMERCE
          - LIGHTSPEED
          - ECWID
          - YAAS
          - SPREECOMMERCE
          - DEMANDWARE
          - VOLUSION
          - PRESTASHOP
          - THREEDCART
          - SYLIUS
          - WIX
          - CUSTOM
          - SWELL
          - MIVA
          - WEBSPHERE
          - ORACLECC
          - SAPCC
          - SQUARESPACE
          - SHOPWARE
          - COMMERCETOOLS
          - MEDUSA
          - ABICART
          - SPRYKER
          - MYSTORE
          - CENTRA
          - XCART
          - VTEX
          - KIBO
          - SALEOR
          - VENDO
          - CHORD
          - DIGITALRIVER
          - SQUARE
          - AMAZON
          - BIGCARTEL
          - RITHUM
          - SHOPRENTER
          - MANUAL
          - SHOPTET
          - SHOPLAZZA
          - CARTPANDA
        fulfillments:
          uniqueItems: true
          type: array
          description: "A list of fulfillments, if any, that have been applied to\
            \ this Bag."
          nullable: true
          items:
            $ref: '#/components/schemas/BagFulfillment'
        discounts:
          uniqueItems: true
          type: array
          description: "A list of discounts, if any, that have been applied to this\
            \ Bag."
          nullable: true
          items:
            $ref: '#/components/schemas/BagDiscount'
        wallet_based_checkout:
          type: boolean
          description: Is this Bag going to be placed through wallet-based checkout.
          default: false
        data:
          $ref: '#/components/schemas/data'
        app_name:
          type: string
          description: Name of app that originated the order. Use the "extended" query
            param when looking up orders to include this value.
        communication_preferences:
          $ref: '#/components/schemas/communication_preferences'
      description: "A per-merchant container within an Order. Each Bag groups the\
        \ SKUs, shipping method, discounts, taxes, and totals for a single merchant.\
        \ Bags have independent status, fulfillment, and financial tracking, and are\
        \ submitted to the merchant's external commerce platform independently. An\
        \ Order with items from 3 merchants will have 3 Bags. All monetary values\
        \ are in the smallest currency unit (e.g. cents for USD)."
      readOnly: true
    BagDiscount:
      required:
      - bag_id
      - date_created
      - date_last_modified
      - id
      - merchant_id
      - status
      - type
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the BagDiscount.
          format: int64
          readOnly: true
        sku_id:
          type: integer
          description: ID of the SKU this discount belong to if a line-item discount
          format: int64
        bag_id:
          type: integer
          description: ID of the Bag this discount belong to
          format: int64
          readOnly: true
        status:
          type: string
          description: Current application status of the discount. Progresses from
            PENDING → APPLIED (or INVALID/NOT_SUPPORTED/ERROR/EXPIRED if the discount
            cannot be applied).
          readOnly: true
          enum:
          - PENDING
          - APPLIED
          - INVALID
          - NOT_SUPPORTED
          - ERROR
          - EXPIRED
          - VALID
        type:
          type: string
          description: "Type of discount. CODE discounts require the customer to provide\
            \ a coupon code. CUSTOM discounts are programmatically defined by the\
            \ app and require value_type, target_type, and amount/percentage to be\
            \ set."
          enum:
          - CODE
          - CUSTOM
        value_type:
          type: string
          description: How the discount value is calculated. AMOUNT means a fixed
            monetary value in cents; PERCENTAGE means a percentage of the target price.
          enum:
          - AMOUNT
          - PERCENTAGE
        target_type:
          type: string
          description: "What the discount is applied to. ORDER applies to the entire\
            \ bag total, SKU applies to a specific line item, SHIPPING applies to\
            \ the shipping cost."
          enum:
          - ORDER
          - SKU
          - SHIPPING
        code:
          type: string
          description: The coupon code entered by the customer. Required when type
            is CODE.
          example: SAVE20
        external_id:
          type: string
          description: External ID of discount
          readOnly: true
        amount:
          type: integer
          description: Fixed discount amount in cents (e.g. 500 = $5.00). Used when
            value_type is AMOUNT. *This value can be null.*
          format: int32
          nullable: true
          example: 500
        percentage:
          type: number
          description: Discount percentage (e.g. 20.0 = 20% off). Used when value_type
            is PERCENTAGE. *This value can be null.*
          format: double
          nullable: true
          example: 20.0
        amount_total:
          type: integer
          description: Total discount amount applied to the bag in cents (e.g. 1000
            = $10.00). Computed by the system after the discount is applied. *This
            value can be null.*
          format: int32
          nullable: true
          readOnly: true
          example: 1000
        date_created:
          type: string
          description: Date of creation
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: Date of last bag discount update
          format: date-time
          readOnly: true
        email:
          type: string
          description: "Customer email address, possibly necessary for once-per-customer\
            \ discounts."
        merchant_id:
          type: integer
          description: "Merchant ID this discount belongs to, if applicable."
          format: int32
      description: "A discount applied to a Bag. Discounts can be code-based (customer\
        \ enters a coupon code) or custom (programmatically defined by the app). Each\
        \ discount tracks its application status, value type (fixed amount or percentage),\
        \ and the target (entire order, specific SKU, or shipping). All monetary values\
        \ are in the smallest currency unit (e.g. cents for USD)."
      nullable: true
    BagFulfillment:
      required:
      - bag_id
      - carrier_status
      - id
      - skus
      - status
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the BagFulfillment.
          format: int64
          readOnly: true
        bag_id:
          type: integer
          description: ID of the bag the fulfillment belongs to.
          format: int64
          readOnly: true
        external_id:
          type: string
          description: ID of the fulfillment on the external commerce platform.
          nullable: true
          readOnly: true
        carrier:
          type: string
          description: Carrier responsible for the fulfillment. Will be OTHER if raw
            carrier is not recognized.
          nullable: true
          readOnly: true
          enum:
          - OTHER
          - UPS
          - USPS
          - FEDEX
          - DHL
          - ONTRAC
          - ROYAL_MAIL
          - SENDLE
          - POSTNORD
          - YUN_EXPRESS
          - AUSTRALIA_POST
        raw_carrier:
          type: string
          description: Raw name of carrier from the external commerce platform.
          nullable: true
          readOnly: true
        status:
          type: string
          description: Status of the bag fullfillment.
          readOnly: true
          enum:
          - PENDING
          - PROCESSING
          - SUCCESS
          - CANCELED
          - ERROR
          - FAILURE
          - NONE_PROVIDED
        carrier_status:
          type: string
          description: Status provided by the carrier.
          readOnly: true
          enum:
          - PENDING
          - LABEL_PURCHASED
          - LABEL_PRINTED
          - CONFIRMED
          - READY_FOR_PICKUP
          - IN_TRANSIT
          - OUT_FOR_DELIVERY
          - ATTEMPTED_DELIVERY
          - DELIVERED
          - FAILURE
          - NONE_PROVIDED
        tracking_number:
          type: string
          description: Tracking number provided by the carrier.
          nullable: true
          readOnly: true
        tracking_url:
          type: string
          description: Tracking URL provided by the carrier.
          nullable: true
          readOnly: true
        skus:
          uniqueItems: true
          type: array
          description: SKUs fulfilled by this fulfillment.
          readOnly: true
          items:
            $ref: '#/components/schemas/BagFulfillmentSku'
      description: A Bag Fulfillment
      nullable: true
    BagFulfillmentSku:
      required:
      - fulfillment_id
      - id
      - order_sku_id
      - quantity_fulfilled
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the BagFulfillmentSku.
          format: int64
          readOnly: true
        fulfillment_id:
          type: integer
          description: ID of the fulfillment that contains this item.
          format: int64
          readOnly: true
        order_sku_id:
          type: integer
          description: ID of the SKU in the Bag.
          format: int64
          readOnly: true
        quantity_fulfilled:
          type: integer
          description: Quantity of the this item fulfilled by this fulfillment.
          format: int32
          readOnly: true
      description: A bag fulfillment sku
      readOnly: true
    Order:
      required:
      - app_id
      - bags
      - currency
      - currency_symbol
      - customer
      - date_created
      - date_last_modified
      - developer_id
      - discount_total
      - id
      - is_guest
      - priced
      - shipping_total
      - status
      - sub_total
      - tax_total
      - total
      - wallet_based_checkout
      type: object
      properties:
        id:
          type: integer
          description: ID of the Violet cart or order.
          format: int64
          readOnly: true
        token:
          type: string
          description: An alternative UUID that can be used as an ID to reference
            the cart or order.
          readOnly: true
          deprecated: true
        errors:
          type: array
          description: "Errors on the Order. During checkout, if there was an error\
            \ or issue on one of the order's bags, there will be an error added to\
            \ this list describing the issue. The checkout API will return 200 with\
            \ the order object in the response even if there was an issue with a bag\
            \ so you must always check the response for errors in this list to know\
            \ if there was an issue on the order."
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/OrderError'
        user_id:
          type: integer
          description: ID of the User placing the order
          format: int64
          readOnly: true
          deprecated: true
        app_id:
          type: integer
          description: ID of the App responsible for the creation and submission of
            this Order.
          format: int32
          readOnly: true
        developer_id:
          type: integer
          description: ID of the Developer responsible for the creation and submission
            of this Order.
          format: int32
          readOnly: true
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        bags:
          type: array
          description: "One or more Bags that make up the Order. Each Bag will contain\
            \ the Sku's, shipping methods, and totals unique to a merchant. Each merchant\
            \ in an Order will have their own Bag."
          readOnly: true
          items:
            $ref: '#/components/schemas/Bag'
        shipping_address:
          $ref: '#/components/schemas/OrderAddress'
        billing_address:
          $ref: '#/components/schemas/OrderAddress'
        payment_method:
          $ref: '#/components/schemas/OrderPaymentMethod'
        sub_total:
          type: integer
          description: "The price of the Order in the base currency before discounts,\
            \ shipping, duties, taxes, and tips. In Cents. *This value can be null\
            \ before the cart has been priced.*"
          format: int32
          default: 0
        shipping_total:
          type: integer
          description: The sum of all shipping methods applied to the Order in the
            base currency. In Cents. *This value can be null before the cart has been
            priced.*
          format: int32
          default: 0
        tax_total:
          type: integer
          description: The sum of all the taxes applied to the Order in the base currency.
            In Cents. *This value can be null before the cart has been priced.*
          format: int32
          default: 0
        discount_total:
          type: integer
          description: The total discounts applied to the price of the Order in the
            base currency. In Cents. *This value can be null before the cart has been
            priced.*
          format: int32
          default: 0
        duty_total:
          type: integer
          description: "The sum of all duties applied to the Order in the base currency.\
            \ In Cents. If not provided, this value will be automatically calculated\
            \ from DUTY-type rates on the Order's SKUs. *This value can be null.*"
          format: int32
          default: 0
        total:
          type: integer
          description: "The sum of all item prices, discounts, shipping, duties, and\
            \ taxes applied to the Order in the base currency. In Cents. *This value\
            \ can be null before the cart has been priced.*"
          format: int32
          default: 0
        app_customer_id:
          maxLength: 191
          type: string
          description: App Customer ID. This should be used to map the order to the
            ID of the customer in your application.
          nullable: true
        app_order_id:
          maxLength: 64
          type: string
          description: "App Order ID. This should be set to a unique identifier in\
            \ your system. While not enforced unique in Violet's system, it is strongly\
            \ recommended that unique values are used for each cart to help correlate\
            \ identifiers between Violet's system and yours."
          nullable: true
        status:
          type: string
          description: Status of the Order
          readOnly: true
          enum:
          - IN_PROGRESS
          - PROCESSING
          - COMPLETED
          - CANCELED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - REQUIRES_ACTION
        is_guest:
          type: boolean
          description: Whether this is a guest checkout order. Guest orders do not
            create or link to a customer account in the merchant's system. Most orders
            placed via the Violet API are guest orders.
          readOnly: true
          default: true
        date_created:
          type: string
          description: Date of order creation
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: "Indicates when the order was last modified. This timestamp\
            \ is updated only when a property on the Order entity itself changes.\
            \ Modifications to related entities (e.g., Bags) will not update this\
            \ timestamp unless the change also triggers an update to the Order entity."
          format: date-time
          readOnly: true
        date_submitted:
          maxLength: 24
          type: string
          description: Date the Order was last submitted in Violet. This value is
            captured immediately after the Order is successfully validated and before
            the nested Bag(s) are submitted to the external commerce platforms.
          format: date-time
          nullable: true
          readOnly: true
        priced:
          type: boolean
          description: Whether the cart has been priced. A cart must be priced before
            it can be submitted for checkout. Pricing is triggered automatically when
            shipping methods are applied and tax/shipping totals are calculated.
          readOnly: true
          default: false
        wallet_based_checkout:
          type: boolean
          description: Is this cart going to be placed through wallet-based checkout
          default: false
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code for the Order.
          example: USD
          default: USD
        referral_id:
          type: string
          description: Optional value used to represent an identifier in your system.
            This value is not required to represent a referral. It can represent the
            ID of anything in your system and can be used to filter order lookup results.
            Max length of 128 characters.
          nullable: true
        currency_symbol:
          type: string
          description: Symbol representing the currency the Order operates in.
          readOnly: true
        app_name:
          type: string
          description: Name of app that originated the order. Use the "extended" query
            param when looking up orders to include this value.
          nullable: true
          readOnly: true
        stripe_key:
          type: string
          description: Stripe publishable key. Use for tokenizing payment methods.
          nullable: true
          readOnly: true
        payment_intent_client_secret:
          type: string
          description: Payment intent client secret. Use for payment intent based
            payment capture and external captures
          nullable: true
          readOnly: true
        payment_transactions:
          uniqueItems: true
          type: array
          description: Payment Transactions associated to the bags on this Cart.
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/PaymentTransaction'
        order_id:
          type: integer
          format: int64
        guest:
          type: boolean
        order_status:
          type: string
          enum:
          - IN_PROGRESS
          - PROCESSING
          - COMPLETED
          - CANCELED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - REQUIRES_ACTION
        intent_based_checkout:
          type: boolean
          description: Boolean indicating if the cart/order will be payed using a
            payment intent.
      description: "A Violet Order representing a shopping cart that progresses through\
        \ checkout to become a placed order. An Order contains one or more Bags (one\
        \ per merchant), a customer, shipping/billing addresses, and a payment method.\
        \ The lifecycle is: create cart → add items → set addresses → apply shipping\
        \ → set payment → submit. All monetary values are in the smallest currency\
        \ unit (e.g. cents for USD)."
    OrderAddress:
      required:
      - address_1
      - city
      - country
      - postal_code
      - state
      type: object
      properties:
        name:
          type: string
          description: Name on Address
          nullable: true
        city:
          type: string
          description: City
        state:
          type: string
          description: State or province abbreviated code.
        country:
          type: string
          description: Country ISO2 Code
        postal_code:
          type: string
          description: "Postal or Zip code to be applied to the address. This value\
            \ is required for all countries that have postal codes. For countries\
            \ that do not have postal codes, this value is optional."
        phone:
          type: string
          description: "Phone number related to the address. Note: Some external commerce\
            \ platforms require this value. For these platforms Violet will use a\
            \ fake number if no value is provided to ensure that the order succeeds."
          nullable: true
        type:
          type: string
          description: Address Type
          readOnly: true
          enum:
          - SHIPPING
          - BILLING
        email:
          type: string
          description: Email Address
        address_1:
          type: string
          description: First line of the Address
        address_2:
          type: string
          description: Second line of the address
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
      description: The shipping or billing address of a user placing an order
      nullable: true
    OrderCustomer:
      required:
      - email
      - first_name
      - last_name
      type: object
      properties:
        first_name:
          maxLength: 32
          type: string
          description: Customer's first name.
        last_name:
          maxLength: 32
          type: string
          description: Customer's last name.
        email:
          maxLength: 64
          type: string
          description: Customer's valid email address.
        shipping_address:
          $ref: '#/components/schemas/OrderAddress'
        billing_address:
          $ref: '#/components/schemas/OrderAddress'
        same_address:
          type: boolean
          description: "When only one address is provided, should the one address\
            \ be used for both the shipping and billing addresses."
          default: false
        name:
          type: string
          description: Full name of the customer.
          readOnly: true
      description: Details of the customer placing the order.
    OrderError:
      required:
      - date_created
      - id
      - order_id
      - type
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the error.
          format: int64
          readOnly: true
        order_id:
          type: integer
          description: ID of the parent Order this error occurred in.
          format: int64
          readOnly: true
        bag_id:
          type: integer
          description: ID of the parent Bag this error occurred in.
          format: int64
          nullable: true
          readOnly: true
        entity_id:
          type: string
          description: ID of the entity that caused the error. See the `entity_type`
            property to determine which entity this ID is associated with.
          nullable: true
          readOnly: true
        entity_type:
          type: string
          description: Type of entity that caused the error. See the `entity_id` property
            to determine which entity of this type is related to the error.
          nullable: true
          readOnly: true
          enum:
          - ORDER
          - BAG
          - SKU
        type:
          type: string
          description: "Type of error, indicates which action was being taken when\
            \ the error occurred."
          readOnly: true
          enum:
          - EXTERNAL_CREATE_CART
          - EXTERNAL_ADD_ITEM
          - EXTERNAL_UPDATE_ITEM
          - EXTERNAL_REMOVE_ITEM
          - EXTERNAL_ADD_CUSTOMER
          - EXTERNAL_ADD_ADDRESSES
          - EXTERNAL_ADD_SHIPPING_ADDRESS
          - EXTERNAL_ADD_BILLING_ADDRESS
          - EXTERNAL_GET_SHIPPING_METHODS
          - EXTERNAL_SET_SHIPPING_METHOD
          - EXTERNAL_SET_PAYMENT_METHOD
          - EXTERNAL_PRICE_CART
          - EXTERNAL_SUBMIT_CART
          - INTERNAL_ADD_ITEM
          - EXTERNAL_DELETE_CART
          - EXTERNAL_CANCEL_ORDER
          - EXTERNAL_WRITE_ORDER
          - EXTERNAL_MARK_ORDER_AS_PAID
          - EXTERNAL_ADD_DISCOUNT_CODE
          - EXTERNAL_REMOVE_DISCOUNT_CODE
          - EXTERNAL_DELETE_ORDER
          - EXTERNAL_REFUND_ORDER
        message:
          maxLength: 255
          type: string
          description: A string message providing more details about the error.
          nullable: true
          readOnly: true
        date_created:
          type: string
          description: Date the error was first created in Violet.
          format: date-time
          readOnly: true
        platform:
          type: string
          description: The external commerce platform the error occurred in.
          nullable: true
          readOnly: true
          enum:
          - OTHER
          - SHOPIFY
          - MAGENTO
          - MAGENTO_ONE
          - WOOCOMMERCE
          - BIGCOMMERCE
          - LIGHTSPEED
          - ECWID
          - YAAS
          - SPREECOMMERCE
          - DEMANDWARE
          - VOLUSION
          - PRESTASHOP
          - THREEDCART
          - SYLIUS
          - WIX
          - CUSTOM
          - SWELL
          - MIVA
          - WEBSPHERE
          - ORACLECC
          - SAPCC
          - SQUARESPACE
          - SHOPWARE
          - COMMERCETOOLS
          - MEDUSA
          - ABICART
          - SPRYKER
          - MYSTORE
          - CENTRA
          - XCART
          - VTEX
          - KIBO
          - SALEOR
          - VENDO
          - CHORD
          - DIGITALRIVER
          - SQUARE
          - AMAZON
          - BIGCARTEL
          - RITHUM
          - SHOPRENTER
          - MANUAL
          - SHOPTET
          - SHOPLAZZA
          - CARTPANDA
      description: Order Error
      nullable: true
      readOnly: true
    OrderPaymentMethod:
      required:
      - payment_method_id
      type: object
      properties:
        brand:
          type: string
          description: Brand of Card
          nullable: true
          readOnly: true
        last_four:
          type: string
          description: Last Four Numbers on Card
          nullable: true
          readOnly: true
        exp_month:
          type: integer
          description: Card Expiration Month
          format: int32
          nullable: true
          readOnly: true
        exp_year:
          type: integer
          description: Card Expiration Year
          format: int32
          nullable: true
          readOnly: true
        cardholder_name:
          type: string
          description: Name as it appears on Card
          nullable: true
          readOnly: true
        payment_method_id:
          type: integer
          description: ID of the referenced Payment Method
          format: int64
          readOnly: true
        default:
          type: boolean
          description: Is Default Method
          nullable: true
          readOnly: true
      description: Payment Method belonging to an Order
      nullable: true
    OrderShippingMethod:
      required:
      - bag_id
      - custom
      - id
      - label
      - merchant_id
      - price
      - shipping_method_id
      - type
      type: object
      properties:
        type:
          type: string
          description: Type of Shipping Method
          readOnly: true
          enum:
          - CALCULATED
          - FLAT_RATE_PRICE
          - FLAT_RATE_WEIGHT
        carrier:
          type: string
          description: The carrier for this shipping method.
          nullable: true
          readOnly: true
          enum:
          - OTHER
          - UPS
          - USPS
          - FEDEX
          - DHL
          - ONTRAC
          - ROYAL_MAIL
          - SENDLE
          - POSTNORD
          - YUN_EXPRESS
          - AUSTRALIA_POST
        label:
          type: string
          description: Shipping method label. This is the name of the shipping method.
        price:
          type: integer
          description: Total cost of the Shipping Method. In Cents. *This value can
            be null.*
          format: int32
          nullable: true
        custom:
          type: boolean
          description: Is the shipping method custom. True when the price has been
            overridden.
          readOnly: true
        min_subtotal:
          type: integer
          description: Minimum Subtotal. In Cents. Only applies to Flat Rate by Price
          format: int32
        max_subtotal:
          type: integer
          description: Maximum Subtotal. In Cents. Only applies to Flat Rate by Price
          format: int32
        min_weight:
          type: number
          description: Minimum Weight. In Cents. Only applies to Flat Rate by Weight
          format: double
        max_weight:
          type: number
          description: Maximum Weight. In Cents. Only applies to Flat Rate by Weight
          format: double
        external_id:
          type: string
          description: ID(s) on external ecommerce platform
          nullable: true
          readOnly: true
        id:
          type: integer
          description: Unique ID of the OrderShippingMethod.
          format: int64
          readOnly: true
        shipping_method_id:
          type: string
          description: ID of the referenced Shipping Method
        bag_id:
          type: integer
          description: ID of the Bag the Shipping Method applies to
          format: int64
          readOnly: true
        merchant_id:
          type: integer
          description: ID of the merchant the bag belongs to
          format: int32
          readOnly: true
        tax_total:
          type: integer
          description: |
            Tax the merchant charges on this shipping method. In Cents.

            Absent means the merchant's commerce platform does not report tax on shipping, or was never asked for it. Zero means the platform was asked and answered that no tax is due. Consumers must not read an absent value as zero.
          format: int32
          nullable: true
        tracking_number:
          type: string
          description: "Carrier Tracking Number. Deprecated: Use `fulfillments` on\
            \ the Bag object instead."
          nullable: true
          readOnly: true
          deprecated: true
      description: Shipping Methods belonging to an Order
      nullable: true
    OrderSku:
      required:
      - app_id
      - available
      - id
      - line_price
      - merchant_id
      - offer_id
      - quantity
      - sku_id
      - status
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the Sku in relation to the order.
          format: int64
          readOnly: true
        name:
          type: string
          description: "Name of the Sku, as provided by the merchant."
          nullable: true
          readOnly: true
        brand:
          type: string
          description: Name of the brand selling this Sku.
          nullable: true
          readOnly: true
        thumbnail:
          type: string
          description: URL of the thumbnail image. Useful for order overview displays.
          nullable: true
          readOnly: true
        quantity:
          maximum: 1000
          type: integer
          description: Quantity of the Sku being purchased. Quantities over 1000 will
            default to 1000. *This value can be null.*
          format: int32
          nullable: true
          default: 1
        price:
          type: integer
          description: "Price of the individual SKU, in cents. If not provided, the\
            \ value from the catalog will be used. *This value can be null.*"
          format: int32
          nullable: true
        weight:
          type: number
          description: Weight of Sku.
          format: double
          nullable: true
          readOnly: true
        height:
          type: number
          description: Height of Sku.
          format: double
          nullable: true
          readOnly: true
        width:
          type: number
          description: Width of Sku.
          format: double
          nullable: true
          readOnly: true
        length:
          type: number
          description: Length of Sku.
          format: double
          nullable: true
          readOnly: true
        available:
          type: boolean
          description: Is the product still available for purchase. If a Sku becomes
            unavailable it likely means that the product became out of stock after
            it was added to the cart. Unavailable Sku's cannot be purchased.
          readOnly: true
        status:
          type: string
          description: Current status of the Sku.
          readOnly: true
          enum:
          - IN_PROGRESS
          - PROCESSING
          - SHIPPED
          - PARTIALLY_SHIPPED
          - DELIVERED
          - COULD_NOT_DELIVER
          - RETURNED
          - CANCELED
          - REFUNDED
          - ERROR
          - PARTIALLY_RETURNED
          - PARTIALLY_REFUNDED
        custom:
          type: boolean
          description: Is the Sku custom. Is `true` when the price has been overridden.
          nullable: true
          readOnly: true
        rates:
          type: array
          description: "Rates that apply specifically to this Sku such as taxes, fees,\
            \ or duties."
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/OrderSkuRate'
        discount:
          $ref: '#/components/schemas/SkuDiscount'
        offer_id:
          type: integer
          description: ID of the parent Offer that this Sku is a child of.
          format: int64
          readOnly: true
        merchant_id:
          type: integer
          description: ID of the Merchant this Sku belongs to.
          format: int32
          readOnly: true
        app_id:
          type: integer
          description: ID of the App responsible for the creation and submission of
            this Order.
          format: int32
          readOnly: true
        product_id:
          type: string
          description: ID of the parent product the offer is a child off.
          nullable: true
          readOnly: true
          deprecated: true
        sku_id:
          type: integer
          description: ID of the referenced Sku from the Violet catalog.
          format: int64
        external_id:
          type: string
          description: ID of the SKU on the external commerce platform.
          nullable: true
          readOnly: true
        product_type:
          type: string
          description: Product type that describes the Sku.
          nullable: true
          readOnly: true
          enum:
          - PHYSICAL
          - DIGITAL
          - VIRTUAL
          - BUNDLED
        custom_properties:
          type: array
          description: Used to provide the merchant with custom values for the product.
            This functionality is currently limited to Shopify merchants.
          nullable: true
          example:
          - name: engraving
            value: Happy Birthday!
          items:
            $ref: '#/components/schemas/OrderSkuCustomProperty'
        commission_rate:
          maximum: 100
          minimum: 0
          type: number
          description: "The commission rate applied to this SKU, expressed as a percentage\
            \ (e.g. 15.0 = 15%). On order creation this may be provided by the channel;\
            \ when omitted it is resolved from the bag-level rate or the system rate.\
            \ Null on orders created before per-SKU rates existed."
          format: double
          nullable: true
          example: 15.0
        commission_rate_source:
          type: string
          description: Provenance of this SKU's commission rate.
          nullable: true
          readOnly: true
          enum:
          - SYSTEM
          - BAG
          - SKU
        line_price:
          type: integer
          description: "Price of the Sku multiplied by the quantity, in Cents. *This\
            \ value can be null.*"
          format: int32
          nullable: true
          readOnly: true
        quantity_fulfilled:
          type: integer
          description: The quantity of this item that has been fulfilled by the merchant.
          format: int32
          nullable: true
          readOnly: true
      description: SKUs belonging to an Order
      readOnly: true
    OrderSkuCustomProperty:
      required:
      - name
      - value
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Name of the custom property.
        value:
          minLength: 1
          type: string
          description: Value of the custom property.
      description: Used to provide the merchant with custom values for the product.
        This functionality is currently limited to Shopify merchants.
      nullable: true
      example:
      - name: engraving
        value: Happy Birthday!
    OrderSkuRate:
      required:
      - amount
