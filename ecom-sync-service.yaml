    Shipping:
      type: object
      properties:
        message:
          type: string
          description: Context regarding the shipping data for this Offer.
          nullable: true
        methods:
          type: array
          description: List of available shipping methods for this Offer.
          nullable: true
          items:
            $ref: '#/components/schemas/Method'
      description: "[BETA] - Shipping data for the Offer. Use `?include=shipping`."
      nullable: true
      readOnly: true
    Sku:
      required:
      - currency
      - date_created
      - date_last_modified
      - external_id
      - id
      - in_stock
      - inventory_tracked
      - merchant_id
      - name
      - offer_id
      - qty_available
      - retail_price
      - sale_price
      - status
      - tax_type
      - taxable
      - type
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of the Sku.
          format: int64
          readOnly: true
        offer_id:
          type: integer
          description: ID of the parent Offer that this Sku is a child of.
          format: int64
        merchant_id:
          type: integer
          description: ID of the Merchant that originated the Sku.
          format: int32
        external_id:
          type: string
          description: The ID of the Sku in the merchants external store.
        name:
          type: string
          description: Name of the Sku. This often a combination of the Offer name
            and the Variant Values unique to this Sku.
        asin:
          type: string
          description: Amazon Standard Identification Number
          nullable: true
        gtin:
          type: string
          description: Global Trade Item Number
          nullable: true
        upc:
          type: string
          description: Universal Product Code
          nullable: true
        ean:
          type: string
          description: European Article Number
          nullable: true
        isbn:
          type: string
          description: International Standard Book Number
          nullable: true
        in_stock:
          type: boolean
          description: Is the Sku in stock in the merchants external store.
          readOnly: true
        qty_available:
          maximum: 30000
          minimum: 0
          type: integer
          description: The total quantity of this SKU available for purchase.
          format: int32
        inventory_tracked:
          type: boolean
          description: Is the Sku's inventory tracked in the merchants system. Untracked
            inventory can be oversold even when the available quantity is 0.
          readOnly: true
        sale_price:
          type: integer
          description: Sale price of the SKU in cents (e.g. 2999 = $29.99). This is
            the actual price the customer will be charged when this SKU is purchased.
          format: int32
          example: 2999
        retail_price:
          type: integer
          description: Retail price of the SKU in cents (e.g. 3999 = $39.99). This
            is often a "Compare-To" or "MSRP" type price and is typically not what
            the customer will be charged.
          format: int32
          example: 3999
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code for this SKU.
          example: USD
        external_currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code representing the merchants default currency
            in their external commerce platform.
          nullable: true
          readOnly: true
          example: USD
        presented_currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 currency code representing the currency that prices
            are displayed in to the end user. May differ from `currency` if currency
            conversion is active.
          nullable: true
          readOnly: true
          example: USD
        taxable:
          type: boolean
          description: Is the Sku taxable.
        tax_type:
          type: string
          description: Type of Tax on this Sku.
          enum:
          - DEFAULT
          - APPAREL
          - SERVICE
        albums:
          uniqueItems: true
          type: array
          description: Sku Albums
          nullable: true
          items:
            $ref: '#/components/schemas/Album'
        variant_values:
          uniqueItems: true
          type: array
          description: Variant Values that apply to this SKU
          nullable: true
          items:
            $ref: '#/components/schemas/SkuVariantValue'
        type:
          type: string
          description: Product type of this SKU. PHYSICAL products require a shipping
            address and shipping method; DIGITAL products do not.
          enum:
          - PHYSICAL
          - DIGITAL
          - VIRTUAL
          - BUNDLED
        status:
          type: string
          description: Current status of the SKU.
          readOnly: true
          enum:
          - UNAVAILABLE
          - AVAILABLE
          - DISABLED_UNAVAILABLE
          - DISABLED_AVAILABLE
          - FOR_DELETION
          - ARCHIVED
        date_created:
          type: string
          description: Date when the SKU was first created in Violet.
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: Date when the SKU was last updated in Violet.
          format: date-time
          readOnly: true
        sku_dimensions:
          $ref: '#/components/schemas/SkuDimensions'
        shipping_dimensions:
          $ref: '#/components/schemas/SkuDimensions'
        trade_compliance:
          $ref: '#/components/schemas/TradeCompliance'
        metadata:
          uniqueItems: true
          type: array
          description: "Additional Meta Data of the Sku. When activated, this data\
            \ can be included by providing the `?include=sku_metadata` query param\
            \ when querying Offer data."
          nullable: true
          items:
            $ref: '#/components/schemas/MetaObject'
        display_order:
          type: integer
          description: The order that the merchant has chosen to display this Sku
            in relation to other Sku's that are children of the same Offer.
          format: int32
          nullable: true
      description: "A purchasable variant of an Offer (product). Each SKU represents\
        \ a unique combination of Variant values (e.g. Size=Medium + Color=Blue) and\
        \ has its own price, inventory, and availability. Use the SKU `id` when adding\
        \ items to a cart or placing orders. All monetary values are in the smallest\
        \ currency unit (e.g. cents for USD)."
      readOnly: true
    SkuDimensions:
      required:
      - type
      type: object
      properties:
        sku_id:
          type: integer
          description: ID of SKU Dimensions Belong To
          format: int64
        weight:
          type: number
          description: Weight of SKU
          format: double
          nullable: true
        height:
          type: number
          description: Height of SKU
          format: double
          nullable: true
        width:
          type: number
          description: Width of SKU
          format: double
          nullable: true
        length:
          type: number
          description: Length of SKU
          format: double
          nullable: true
        type:
          type: string
          description: Dimensions Type
          enum:
          - SKU
          - SHIPPING
      description: Individual Sku Dimensions
      nullable: true
    SkuVariantValue:
      required:
      - value
      - variant
      type: object
      properties:
        variant:
          type: string
          description: Variant Name
        value:
          type: string
          description: Variant Value
      description: Individual Variation Value for a Sku
      nullable: true
    TradeCompliance:
      type: object
      properties:
        harmonized_system_code:
          type: string
          description: The default Harmonized System (HS) code for this SKU. 6-13
            digit code used for international tariff classification. First 6 digits
            follow the international HS standard. Used as a fallback when no country-specific
            code exists for a destination.
          nullable: true
          example: 6109.10.00
        country_code_of_origin:
          type: string
          description: ISO 3166-1 alpha-2 country code where the product was manufactured
            or substantially transformed. Critical for determining applicable tariff
            rates and trade agreement eligibility.
          nullable: true
          example: US
        province_code_of_origin:
          type: string
          description: ISO 3166-2 subdivision code for the province/state of origin.
            Used for more specific origin tracking.
          nullable: true
          example: CA
      description: Trade compliance and customs information for a SKU
      nullable: true
    Variant:
      required:
      - id
      - name
      - values
      - visual
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        product_variant_id:
          type: string
          description: ID of the Product Variant
          deprecated: true
        external_id:
          type: string
          description: ID of the Variant on the External Ecommerce Platform
          nullable: true
        name:
          type: string
          description: The name given to the Variant by the merchant.
        visual:
          type: boolean
          description: "Is the variant a visual characteristic. Common examples of\
            \ this would be Color, Pattern, or Material."
          readOnly: true
        values:
          uniqueItems: true
          type: array
          description: Variant Values
          readOnly: true
          items:
            $ref: '#/components/schemas/VariantValue'
        display_order:
          type: integer
          description: The order the variants are displayed in.
          format: int32
          nullable: true
      description: Variation Data
      readOnly: true
    VariantValue:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        product_variant_value_id:
          type: string
          description: ID of the Product Variation Value
        external_id:
          type: string
          description: ID of the Variant in the External Ecommerce Platform
          nullable: true
        name:
          type: string
          description: Variant Value Name
        sku_ids:
          uniqueItems: true
          type: array
          description: ID's of SKU's containing this Variant Value
          nullable: true
          items:
            type: integer
            description: ID's of SKU's containing this Variant Value
            format: int64
            nullable: true
        display_order:
          type: integer
          description: The order the variant values are displayed in.
          format: int32
          nullable: true
      description: Individual Variation Value
      readOnly: true
    Weight:
      type: object
      properties:
        value:
          type: number
          description: Weight value
          format: double
          nullable: true
        unit:
          type: string
          nullable: true
          enum:
          - INCHES
          - FEET
          - CENTIMETERS
          - OUNCES
          - POUNDS
          - GRAMS
          - KILOGRAMS
          - CARATS
          - YARDS
          - MILLIMETERS
          - TONNES
          - MILLIGRAMS
          - LITERS
          - MILLILITERS
          - QUARTS
          - QUARTERS
          - GALLONS
          - PINTS
          - METERS
          - OUNCES
          - POUNDS
          - GRAMS
          - KILOGRAMS
          - TONNES
      description: Weight required to enable the shipping method.
      nullable: true
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        code:
          type: integer
          format: int32
        data:
