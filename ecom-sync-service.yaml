components:
  schemas:
    InvalidProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: string
          description: ID of product on external platform
        name:
          type: string
          description: Name of product on external platform
        thumbnail_url:
          type: string
          description: URL to product thumbnail
        merchant_id:
          type: integer
          description: ID of merchant with broken product
          format: int32
        issues:
          type: string
          description: Comma separated list of product invalidation reasons
        status:
          type: string
          description: Status of the invalidation
          enum:
          - UNRESOLVED
          - RESOLVED
        date_created:
          type: string
          description: Date created
          format: date-time
        date_last_modified:
          type: string
          description: Date of last update
          format: date-time
      description: Any products that could not be synced
    VioletPageInvalidProduct:
      type: object
      properties:
        content:
          type: array
          description: The actual content of the response; A list of the result objects
          items:
            $ref: '#/components/schemas/InvalidProduct'
        last:
          type: boolean
          description: Boolean indicating if this is the last page
        total_pages:
          type: integer
          description: The total count of pages available
          format: int32
        total_elements:
          type: integer
          description: The total count of objects available
          format: int32
        first:
          type: boolean
          description: Boolean indicating if this is the first page of the response
        number_of_elements:
          type: integer
          description: The total number of objects in this specific response
          format: int32
        size:
          type: integer
          description: The page size selected at request time
          format: int32
        number:
          type: integer
          description: The page number selected at request time
          format: int32
        empty:
          type: boolean
          description: Boolean indicating if the response content is empty
        next_page_cursor:
          type: string
          description: Contains the cursor for the next page. This property will only
            be used for situations where the API does not support the page number/page
            size paradigm and it will mutually exclusive with the size/number fields
            in the response. If this property is returned it must be passed when requesting
            the next page from the API. Does not apply to endpoints that do not have
            a next_page_cursor query param documented.
        pageable:
          $ref: '#/components/schemas/VioletPageable'
        sort:
          $ref: '#/components/schemas/VioletSort'
    VioletPageable:
      type: object
      properties:
        page_number:
          type: integer
          description: The current page number (one based)
          format: int32
        page_size:
          type: integer
          description: The number of elements per page
          format: int32
        sort:
          $ref: '#/components/schemas/VioletSort'
        offset:
          type: integer
          description: The offset
          format: int64
        paged:
          type: boolean
          description: Boolean indicating if the result is paged
        unpaged:
          type: boolean
          description: Boolean indicating if the result is unpaged
      description: Violet wrapper for springframework pageable
    VioletSort:
      type: object
      properties:
        unsorted:
          type: boolean
          description: Boolean indicating if the result set is unsorted
        sorted:
          type: boolean
          description: Boolean indicating if the result set is sorted
        empty:
          type: boolean
          description: Boolean indicating if the result set is empty
      description: Violet Wrapper for springframework sort
    SearchInvalidProductsRequest:
      type: object
      properties:
        name:
          type: string
        externalId:
          type: string
    Album:
      required:
      - id
      - media
      - name
      - parent_id
      - type
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        parent_id:
          type: integer
          description: ID of the parent entity
          format: int64
        type:
          type: string
          description: Parent Type
          enum:
          - OFFER
          - SKU
        name:
          type: string
          description: Name of Album
        media:
          uniqueItems: true
          type: array
          description: Album media
          readOnly: true
          items:
            $ref: '#/components/schemas/Media'
        primary_media:
          $ref: '#/components/schemas/Media'
      description: Product Image Container
      readOnly: true
    Collection:
      required:
      - date_created
      - date_last_modified
      - external_id
      - id
      - merchant_id
      - status
      - type
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        external_id:
          type: string
          description: External ID
        merchant_id:
          type: integer
          description: Merchant ID
          format: int32
        parent_id:
          type: integer
          description: Parent ID for platforms that have a parent-child collection
            structure.
          format: int64
          nullable: true
        name:
          type: string
          description: Name of this collection
          nullable: true
        handle:
          type: string
          description: Handle of this collection
          nullable: true
        description:
          type: string
          description: Description of this collection
          nullable: true
        status:
          type: string
          description: Status of this collection
          readOnly: true
          enum:
          - INACTIVE
          - ACTIVE
          - SYNC_IN_PROGRESS
          - FOR_DELETION
        type:
          type: string
          description: Type of this collection
          readOnly: true
          enum:
          - CUSTOM
          - AUTOMATED
        media:
          $ref: '#/components/schemas/CollectionMedia'
        date_created:
          type: string
          description: Date of creation of this collection on platform
          format: date-time
          readOnly: true
        date_last_modified:
          type: string
          description: Date of last update of this collection on platform
          format: date-time
          readOnly: true
      description: Offers Collection
      nullable: true
    CollectionMedia:
      type: object
      properties:
        source_url:
          type: string
          description: Source URL
          nullable: true
        alt:
          type: string
          description: Alt
          nullable: true
        height:
          type: integer
          description: Height
          format: int32
          nullable: true
        width:
          type: integer
          description: Width
          format: int32
          nullable: true
        date_created:
          type: string
          description: Date of media creation on platform
          format: date-time
          nullable: true
      description: Collection Media
      nullable: true
    Condition:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Price'
        weight:
          $ref: '#/components/schemas/Weight'
        type:
          type: string
          description: "Condition type, whether it's price or weight based."
          nullable: true
          enum:
          - TOTAL_PRICE
          - TOTAL_WEIGHT
        operator:
          type: string
          description: Operator indicating if the price or weight is >= or <= the
            condition value.
          nullable: true
          enum:
          - LESS_THAN_OR_EQUAL_TO
          - GREATER_THAN_OR_EQUAL_TO
      description: Conditions that must be met for the method to be available.
      nullable: true
    Media:
      required:
      - album_id
      - display_order
      - id
      - primary
      - source_url
      - type
      - url
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        album_id:
          type: integer
          description: Album ID
          format: int64
        external_id:
          type: string
          description: The ID of the media in the merchants store.
          nullable: true
        cloud_id:
          type: string
          description: The unique ID of hosted cloud entity. Only present on media
            from self-hosted platforms.
          nullable: true
        url:
          type: string
          description: The URL that should be used when displaying media within your
            app. For cloud hosted commerce platforms that provide a CDN this will
            often be the same as the `source_url` property. For self-hosted platforms
            this will typically be a Violet CDN URL.
        source_url:
          type: string
          description: The original URL from the merchants system.
        type:
          type: string
          description: Media Type
          readOnly: true
          enum:
          - IMAGE
          - VIDEO
        display_order:
          type: integer
          description: The order in which the merchant displayed the media in relation
            to other media in the same collection.
          format: int32
        alt_text:
          maxLength: 512
          type: string
          description: Text describing the media. This value is sourced from the merchant.
          nullable: true
        primary:
          type: boolean
          description: If the media is the primary or default image in the merchants
            store for an Offer or Sku. This is typically the cover image on a product
            details page.
      description: Product and SKU Media
    MetaObject:
      required:
      - key
      type: object
      properties:
        version:
          type: number
          description: Schema version
          format: double
          nullable: true
        type:
          type: string
          description: Type of the value
          nullable: true
          enum:
          - STRING
          - JSON
          - INTEGER
          - LONG
          - DECIMAL
          - BOOLEAN
        external_type:
          type: string
          description: Type of the value in the external commerce platform
          nullable: true
        key:
          type: string
          description: The key of meta value
        value:
          type: object
          description: The meta value. Values of type JSON will be stringified
          nullable: true
        external_id:
          type: string
          description: ID of the meta object in the external commerce platform
          nullable: true
        source:
          type: string
          description: "The source the meta object originated from, either EXTERNAL\
            \ or INTERNAL, with EXTERNAL representing data from the external commerce\
            \ platform"
          nullable: true
          enum:
          - INTERNAL
          - EXTERNAL
      description: Meta Object
      nullable: true
    Method:
      type: object
      properties:
        external_id:
          type: string
          description: ID of the shipping method in the external commerce system.
          nullable: true
        name:
          type: string
          description: Name of the shipping method as provided by the merchant.
          nullable: true
        price:
          $ref: '#/components/schemas/Price'
        regions:
          $ref: '#/components/schemas/Regions'
        conditions:
          type: array
          description: Conditions that must be met for the method to be available.
          nullable: true
          items:
            $ref: '#/components/schemas/Condition'
      description: List of available shipping methods for this Offer.
      nullable: true
    Offer:
      required:
      - available
      - currency
      - date_created
      - date_last_modified
      - external_id
      - id
      - max_price
      - merchant_id
      - min_price
      - name
      - publishing_status
      - seller
      - skus
      - source
      - status
      - type
      - variants
      - visible
      type: object
      properties:
        id:
          type: integer
          description: Unique ID of the Offer.
          format: int64
          readOnly: true
        product_id:
          type: string
          description: "The parent/container product ID. Note: this is a legacy property\
            \ and is now considered deprecated."
          deprecated: true
        external_id:
          type: string
          description: The ID of the product in the merchants external store.
        external_url:
          type: string
          description: "The URL to the product page in the merchants store. Note:\
            \ if the value for `visible` is `false` this URL will likely result in\
            \ a 404."
          nullable: true
        name:
          type: string
          description: Name of the offer as defined by the source merchant.
          example: Blue Running Sneakers
        description:
          maxLength: 65000
          type: string
          description: "Description of the offer. Note: this value may contain HTML\
            \ elements."
          nullable: true
        source:
          type: string
          description: Commerce platform the offer was sourced from.
          readOnly: true
          enum:
          - OTHER
          - SHOPIFY
          - MAGENTO
          - MAGENTO_ONE
          - WOOCOMMERCE
          - BIGCOMMERCE
          - LIGHTSPEED
          - ECWID
          - YAAS
          - SPREECOMMERCE
          - DEMANDWARE
          - VOLUSION
          - PRESTASHOP
          - THREEDCART
          - SYLIUS
          - WIX
