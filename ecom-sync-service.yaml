openapi: 3.0.1
info:
  title: Ecom-Sync-Service
  description: Ecom-Sync Service API
  contact:
    name: Violet.io
    url: https://violet.io
  version: v1
servers:
- url: https://sandbox-api.violet.io/v1
tags:
- name: EcomSync
- name: External Checkout
- name: External Events
- name: External Events - 3dCart
- name: External Events - BigCommerce
- name: External Events - ECWID
- name: External Events - Lightspeed
- name: External Events - Magento
- name: External Events - Magento (Shared)
- name: External Events - PrestaShop
- name: External Events - Shopify
- name: External Events - TDC
- name: External Events - Volusion
- name: External Events - WIX
- name: External Events - WooCommerce
- name: Internal
- name: Invalid Products
- name: Shop Profile
- name: Relay
  description: |
    Reads data straight from the merchant's ecom platform when you call it. Nothing is served from Violet's catalog or order tables, so a response shows the platform's current state and takes as long as the platform's API does.

    **Access.** Send `X-Violet-Token`, `X-Violet-App-Secret` and `X-Violet-App-Id` on every request. The token must belong to the developer that owns the app, otherwise the call fails with 403 `insufficient_permissions`. Every endpoint except Get Shipping Zones also requires the app to be subscribed to the Relay plan, and fails with the same 403 if it is not. The app must also be connected to the merchant, otherwise the call fails with 401 `merchant_not_connected`.

    **Platform support.** Each endpoint lists the platforms it supports. What happens on any other platform depends on the endpoint and is described there.

    **Pagination.** List endpoints paginate by cursor or by page number, depending on the platform.
    - Cursor platforms (for example Shopify) return `next_page_cursor`. Send it back as the `next_page_cursor` query parameter to get the next page, and stop when `last` is `true`. The cursor carries the filters of the first request, so filters sent with a cursor are ignored.
    - Page-number platforms (for example WooCommerce and BigCommerce) use `page` and `size`, and the filters must be sent on every request. Request pages until one comes back empty. Do not rely on `last` or the totals on these platforms: `last` is not set reliably, and some report totals for the current page only.

    **Filters.** A filter applies only on the platforms named in its description. Other platforms ignore it without returning an error, so the results may be unfiltered.

    **Errors.** Errors use Violet's standard body with `error`, `code` and `message`. If the merchant's platform rejects Violet's stored connection, an endpoint answers 400 `invalid_merchant_credentials` on the platforms that detect it, and Shopify list calls report a platform 404 the same way. On other platforms, and on endpoints that do not check, the same failure comes back as a 500.
- name: Schedule
paths:
  /sync/merchants/{merchant_id}/invalid_products:
    get:
      tags:
      - Invalid Products
      summary: Get InvalidProduct Records By Merchant Id
      operationId: getMerchantInvalidProducts
      parameters:
      - name: X-Violet-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        required: true
        schema:
          type: integer
          format: int32
      - name: merchant_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 6
      - name: app_id
        in: query
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VioletPageInvalidProduct'
  /sync/merchants/{merchant_id}/invalid_products/search:
    post:
      tags:
      - Invalid Products
      summary: Search InvalidProduct Records By Merchant Id
      operationId: searchMerchantInvalidProducts
      parameters:
      - name: X-Violet-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        required: true
        schema:
          type: integer
          format: int32
      - name: merchant_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: app_id
        in: query
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchInvalidProductsRequest'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VioletPageInvalidProduct'
  /sync/offers/{offer_id}:
    post:
      tags:
      - EcomSync
      summary: Sync single offer. Retrieves a single product from the external ecommerce
        platform and updates the corresponding offer in the Violet system
      operationId: syncOffer
      parameters:
      - name: X-Violet-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        required: true
        schema:
          type: integer
          format: int32
      - name: offer_id
        in: path
        required: true
        schema:
          type: integer
          description: The ID of an Offer in the Violet system.
          format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        "404":
          description: offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Offer could not be found.
                error: offer_not_found
                code: 2004
        "401":
          description: no merchant connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: App not connected to merchant. Merchant must connect to your
                  app before you can access their data.
                error: merchant_not_connected
                code: 7118
        "403":
          description: insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: You do not have permission to access this resource.
                error: insufficient_permissions
                code: 9901
  /relay/merchants/{merchant_id}/collections/{collection_id}:
    get:
      tags:
      - Relay
      summary: Relay - Get Collection
      description: |-
        Returns one collection from the merchant's ecom platform by its platform ID.

        Supported platforms: Shopify. On any other platform the response is 204 No Content.
      operationId: getCollection
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: collection_id
        in: path
        description: ID of the collection on the merchant's platform. This is the
          `external_id` of the collection.
        required: true
        schema:
          type: string
          example: "428123456789"
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              examples:
                shopify:
                  description: shopify
                  value:
                    external_id: "428123456789"
                    merchant_id: 12345
                    name: Travel Bags
                    handle: travel-bags
                    description: Bags for weekends away.
                    status: ACTIVE
                    type: CUSTOM
                    media:
                      source_url: https://cdn.example.com/files/travel-bags.jpg
                      alt: Three travel bags on a bench
                      width: 1200
                      height: 800
        "204":
          description: The platform is not supported by this endpoint.
        "400":
          description: "On Shopify, the platform rejected Violet's stored connection\
            \ (`invalid_merchant_credentials`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_merchant_credentials:
                  description: invalid_merchant_credentials
                  value:
                    message: The provided merchant credentials are invalid.
                    error: invalid_merchant_credentials
                    code: 2503
  /relay/merchants/{merchant_id}/collections/{collection_id}/offers:
    get:
      tags:
      - Relay
      summary: Relay - Get Collection Offers
      description: |-
        Returns a page of the products in one collection on the merchant's ecom platform.

        Supported platforms: Shopify and Demandware. On any other platform the response is 204 No Content.
      operationId: getCollectionOffers
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: collection_id
        in: path
        description: ID of the collection on the merchant's platform. This is the
          `external_id` of the collection.
        required: true
        schema:
          type: string
          example: "428123456789"
      - name: size
        in: query
        description: "Number of results per page. Values below 1 are treated as 1.\
          \ Violet reduces larger values only where noted below. Elsewhere the value\
          \ is sent on as given and the platform may apply its own limit. Caps: Shopify\
          \ 250."
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        description: "Page number, starting at 1. Used by page-number platforms (for\
          \ example WooCommerce and BigCommerce). Cursor platforms such as Shopify\
          \ ignore it and use `next_page_cursor`."
        schema:
          type: integer
          format: int32
          default: 1
      - name: next_page_cursor
        in: query
        description: "Cursor for the next page, copied from `next_page_cursor` in\
          \ the previous response. Used by cursor platforms such as Shopify. Filters\
          \ sent with a cursor are ignored, because the cursor carries the filters\
          \ of the first request."
        schema:
          type: string
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: A page of offers in the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VioletPageOffer'
              examples:
                cursor_pagination:
                  summary: Cursor pagination (Shopify)
                  description: cursor_pagination
                  value:
                    content:
                    - external_id: "7469837175852"
                      name: Canvas Weekender Bag
                      description: Durable cotton canvas weekender with leather handles.
                      source: SHOPIFY
                      seller: Example Goods
                      vendor: Example Goods
                      merchant_id: 12345
                      available: true
                      visible: true
                      min_price: 12900
                      max_price: 12900
                      currency: USD
                      type: PHYSICAL
                      status: AVAILABLE
                      publishing_status: NOT_PUBLISHED
                      external_url: https://shop.example.com/products/canvas-weekender-bag
                      variants:
                      - name: Color
                        values:
                        - name: Natural
                      skus:
                      - external_id: "42001965334700"
                        name: Canvas Weekender Bag - Natural
                        in_stock: true
                        qty_available: 14
                        retail_price: 15900
                        sale_price: 12900
                        currency: USD
                        taxable: true
                        type: PHYSICAL
                        variant_values:
                        - variant: Color
                          value: Natural
                      albums:
                      - type: OFFER
                        name: Canvas Weekender Bag
                        media:
                        - external_id: "34567890123"
                          source_url: https://cdn.example.com/files/weekender-natural.jpg
                          type: IMAGE
                          display_order: 1
                          primary: true
                    last: false
                    number_of_elements: 1
                    empty: false
                    next_page_cursor: eyJsYXN0X2lkIjo3NDY5ODM3MTc1ODUyfQ
        "204":
          description: The platform is not supported by this endpoint.
        "400":
          description: "On Shopify, the platform rejected Violet's stored connection\
            \ (`invalid_merchant_credentials`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_merchant_credentials:
                  description: invalid_merchant_credentials
                  value:
                    message: The provided merchant credentials are invalid.
                    error: invalid_merchant_credentials
                    code: 2503
  /relay/merchants/{merchant_id}/collections:
    get:
      tags:
      - Relay
      summary: Relay - Get Collections
      description: |-
        Returns a page of collections from the merchant's ecom platform. A collection is a named group of products.

        Supported platforms: Shopify and Demandware. On any other platform the response is 204 No Content.
      operationId: getCollections
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: size
        in: query
        description: "Number of results per page. Values below 1 are treated as 1.\
          \ Violet reduces larger values only where noted below. Elsewhere the value\
          \ is sent on as given and the platform may apply its own limit. Caps: Shopify\
          \ 250."
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        description: "Page number, starting at 1. Used by page-number platforms (for\
          \ example WooCommerce and BigCommerce). Cursor platforms such as Shopify\
          \ ignore it and use `next_page_cursor`."
        schema:
          type: integer
          format: int32
          default: 1
      - name: next_page_cursor
        in: query
        description: "Cursor for the next page, copied from `next_page_cursor` in\
          \ the previous response. Used by cursor platforms such as Shopify. Filters\
          \ sent with a cursor are ignored, because the cursor carries the filters\
          \ of the first request."
        schema:
          type: string
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: A page of collections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VioletPageCollection'
              examples:
                cursor_pagination:
                  summary: "Cursor pagination (Shopify), last page"
                  description: cursor_pagination
                  value:
                    content:
                    - external_id: "428123456789"
                      merchant_id: 12345
                      name: Travel Bags
                      handle: travel-bags
                      description: Bags for weekends away.
                      status: ACTIVE
                      type: CUSTOM
                      media:
                        source_url: https://cdn.example.com/files/travel-bags.jpg
                        alt: Three travel bags on a bench
                        width: 1200
                        height: 800
                    last: true
                    number_of_elements: 1
                    empty: false
                    next_page_cursor: ""
        "204":
          description: The platform is not supported by this endpoint.
        "400":
          description: "On Shopify, the platform rejected Violet's stored connection\
            \ (`invalid_merchant_credentials`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_merchant_credentials:
                  description: invalid_merchant_credentials
                  value:
                    message: The provided merchant credentials are invalid.
                    error: invalid_merchant_credentials
                    code: 2503
  /relay/merchants/{merchant_id}/customers/{customer_id}:
    get:
      tags:
      - Relay
      summary: Relay - Get Customer
      description: |-
        Returns one customer from the merchant's ecom platform by its platform ID. Fields the platform does not provide are omitted.

        Supported platforms: Shopify, BigCommerce, WooCommerce, Magento, Square, Centra, commercetools, Miva and Saleor. On any other platform the response is 204 No Content.
      operationId: getCustomer
      parameters:
      - name: X-Violet-Token
        in: header
        description: Violet auth token. It must belong to the developer that owns
          the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Secret
        in: header
        description: Secret of the app in `X-Violet-App-Id`.
        required: true
        schema:
          type: string
      - name: X-Violet-App-Id
        in: header
        description: ID of the Violet app making the request. The app must be connected
          to the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 20001
      - name: merchant_id
        in: path
        description: Violet ID of the merchant.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: customer_id
        in: path
        description: ID of the customer on the merchant's platform. This is the `external_id`
          of the customer.
        required: true
        schema:
          type: string
          example: "6012345678901"
      - name: include
        in: query
        description: Accepted but has no effect.
        schema:
          type: string
      responses:
        "401":
          description: The app is not connected to the merchant (`merchant_not_connected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                merchant_not_connected:
                  description: merchant_not_connected
                  value:
                    message: App not connected to merchant with ID 12345. Merchant
                      must connect to your app before you can access their data.
                    error: merchant_not_connected
                    code: 7118
        "403":
          description: "The token does not belong to the developer that owns the app,\
            \ or the app is not subscribed to the Relay plan (`insufficient_permissions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_permissions:
                  description: insufficient_permissions
                  value:
                    message: You do not have permission to access this resource.
                    error: insufficient_permissions
                    code: 9901
        "500":
          description: The request failed in Violet or while reading from the merchant's
            platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayCustomer'
              examples:
                shopify:
                  description: shopify
                  value:
                    external_id: "6012345678901"
